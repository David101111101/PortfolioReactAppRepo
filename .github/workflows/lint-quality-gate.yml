name: Lint Quality Gate

env:
  MAX_ALLOWED_LINT_ERRORS: 0

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write 

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Static Code Quality (Lint + Types + Markup)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            portfolio-chatbot/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ========================
      # ESLint
      # ========================
      - name: Run ESLint
        continue-on-error: true
        run: |
          mkdir -p summaries
          npx eslint . -f stylish | tee summaries/eslint.txt

      # ========================
      # TypeScript
      # ========================
      - name: Run Type Check
        continue-on-error: true
        run: |
          npx tsc --noEmit | tee summaries/typecheck.txt

      # ========================
      # CSS
      # ========================
      - name: Run Stylelint
        continue-on-error: true
        run: |
          npx stylelint "**/*.css" | tee summaries/stylelint.txt

      # ========================
      # HTML
      # ========================
      - name: Run HTMLHint
        continue-on-error: true
        run: |
          npx htmlhint "**/*.html" | tee summaries/htmlhint.txt

      # ========================
      # Build lint summary
      # ========================
      - name: Generate Lint Summary
        if: always()
        run: |
          node scripts/lint-summary.mjs

      # ========================
      # Upload artifact (for cross-workflow aggregation later)
      # ========================
      - name: Upload lint summary artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lint-summary
          path: summaries/lint.md
      
      - name: Upload lint metrics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: metrics-lint
          path: metrics/lint.json

      # ========================
      # Publish GitHub Job Summary (nice UX)
      # ========================
      - name: Publish Job Summary
        if: always()
        run: |
          cat summaries/lint.md >> $GITHUB_STEP_SUMMARY

      - name: Enforce error threshold
        if: always()
        run: |
          node -e "const fs=require('fs'); const metrics=JSON.parse(fs.readFileSync('metrics/lint.json','utf8')); if (!metrics.thresholdPassed) { console.error('Lint quality gate failed: ' + metrics.totalErrors + ' total errors exceed allowed maximum of ' + metrics.maxAllowedErrors + '.'); process.exit(1); } console.log('Lint quality gate passed: ' + metrics.totalErrors + ' total errors within allowed maximum of ' + metrics.maxAllowedErrors + '.');"
      
  pr-comment:
        name: PR Comment (Lint Summary)
        if: ${{ always() 
            && github.event_name == 'pull_request'
            && github.event.pull_request.head.repo.full_name == github.repository }}
        needs: lint
        runs-on: ubuntu-latest

        steps:
          - name: Download lint summary
            uses: actions/download-artifact@v5
            with:
              name: lint-summary
              path: summaries

          - name: Download lint metrics
            uses: actions/download-artifact@v5
            with:
              name: metrics-lint
              path: metrics

          - name: Build PR comment body
            run: |
              echo "" >> comment.md
              cat summaries/lint.md >> comment.md
              echo "" >> comment.md
              echo "_This signal validates static code health (lint, types, markup)._ " >> comment.md

          - name: Create or update lint comment
            uses: actions/github-script@v7
            with:
              script: |
                const fs = require('fs');
                const body = fs.readFileSync('comment.md', 'utf8');
                const issue_number = context.payload.pull_request.number;

                const { data: comments } = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  per_page: 100,
                });

                const existing = comments.find((c) =>
                  c.user?.login === 'github-actions[bot]' &&
                  typeof c.body === 'string' &&
                  c.body.includes('Static Quality Gate Results')
                );

                if (existing) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: existing.id,
                    body,
                  });
                } else {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number,
                    body,
                  });
                }