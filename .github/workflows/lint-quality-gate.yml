name: Lint Quality Gate

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write 

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Static Code Quality (Lint + Types + Markup)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            portfolio-chatbot/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ========================
      # ESLint
      # ========================
      - name: Run ESLint
        run: |
          mkdir -p summaries
          npx eslint . -f stylish | tee summaries/eslint.txt

      # ========================
      # TypeScript
      # ========================
      - name: Run Type Check
        run: |
          npx tsc --noEmit | tee summaries/typecheck.txt || true

      # ========================
      # CSS
      # ========================
      - name: Run Stylelint
        run: |
          npx stylelint "**/*.css" | tee summaries/stylelint.txt || true

      # ========================
      # HTML
      # ========================
      - name: Run HTMLHint
        run: |
          npx htmlhint "**/*.html" | tee summaries/htmlhint.txt || true

      # ========================
      # Build lint summary
      # ========================
      - name: Generate Lint Summary
        if: always()
        run: |
          node scripts/lint-summary.mjs

      # ========================
      # Upload artifact (for cross-workflow aggregation later)
      # ========================
      - name: Upload lint summary artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lint-summary
          path: summaries/lint.md
      
      - name: Upload lint metrics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: metrics-lint
          path: metrics/lint.json

      # ========================
      # Publish GitHub Job Summary (nice UX)
      # ========================
      - name: Publish Job Summary
        if: always()
        run: |
          cat summaries/lint.md >> $GITHUB_STEP_SUMMARY
      
  pr-comment:
        name: PR Comment (Lint Summary)
        if: ${{ always() 
            && github.event_name == 'pull_request'
            && github.event.pull_request.head.repo.full_name == github.repository }}
        needs: lint
        runs-on: ubuntu-latest

        steps:
          - name: Download lint summary
            uses: actions/download-artifact@v5
            with:
              name: lint-summary
              path: summaries

          - name: Download lint metrics
            uses: actions/download-artifact@v5
            with:
              name: metrics-lint
              path: metrics

          - name: Build PR comment body
            run: |
              echo "## 🧹 Static Quality Gate Results" > comment.md
              echo "" >> comment.md
              cat summaries/lint.md >> comment.md
              echo "" >> comment.md
              echo "_This signal validates static code health (lint, types, markup)._ " >> comment.md

          - name: Find existing lint comment
            uses: peter-evans/find-comment@v3
            id: fc
            with:
              issue-number: ${{ github.event.pull_request.number }}
              comment-author: "github-actions[bot]"
              body-includes: "Static Quality Gate Results"

          - name: Create or update lint comment
            uses: peter-evans/create-or-update-comment@v5
            with:
              issue-number: ${{ github.event.pull_request.number }}
              comment-id: ${{ steps.fc.outputs.comment-id }}
              body-path: comment.md
              edit-mode: replace