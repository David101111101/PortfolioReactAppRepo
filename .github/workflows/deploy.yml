name: Deployment Quality Gates

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  checks: write   # Needed for JUnit publishing

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

  # =====================================
  # 1️⃣ Backend Verification (Tier 2)
  # =====================================
  backend:
    name: Backend Tests (unit + contract)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            portfolio-chatbot/package-lock.json

      # Install root deps (if needed)
      - name: Install root deps
        run: npm ci --prefer-offline

      - name: Install backend deps
        run: |
          cd portfolio-chatbot
          npm ci --prefer-offline

      # Start Worker in background for contract test
      - name: Start Worker
        run: |
          cd portfolio-chatbot
          npm run dev > worker.log 2>&1 &
          npx wait-on tcp:127.0.0.1:8787 --timeout 40000

      # Run backend tests
      - name: Run backend tests
        run: |
          cd portfolio-chatbot
          npm run test:ci

  # =====================================
  # 2️⃣ Frontend E2E Multi-Browser
  # =====================================
  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    env:
      VITE_BASE: /
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WORKFLOW_TYPE: deploy_e2e
      PLAYWRIGHT_BROWSER: ${{ matrix.browser }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            portfolio-chatbot/package-lock.json

      - name: Install deps
        run: npm ci --prefer-offline

      - name: Restore Playwright browser cache
        id: playwright-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ matrix.browser }}-
      
      # Install OS dependencies required by browsers (run even when browsers are cached)
      - name: Install Playwright OS deps
        run: npx playwright install-deps ${{ matrix.browser }}

      # Keep browser download/cache behavior
      - name: Install browser
        run: |
          for i in 1 2 3; do
            npx playwright install ${{ matrix.browser }} && break
            echo "Retry browser install..."
            sleep 15
          done

      - name: Build
        run: npm run build
        env:
          VITE_BASE: "/"

      - name: Prepare report folder
        run: mkdir -p playwright-report

      - name: Set RUN_ID
        run: echo "RUN_ID=${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.browser }}" >> $GITHUB_ENV

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Save Playwright browser cache
        if: ${{ always() }}
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}

      - name: Generate E2E summary
        if: always()
        run: node scripts/playwright-summary.mjs ${{ matrix.browser }} || true

      - name: Generate flaky summary
        if: always()
        run: node scripts/flaky-summary.mjs >> $GITHUB_STEP_SUMMARY || true
      
      # Enforce flaky budget (No more than 3 flaky tests allowed)
      - name: Enforce flaky budget
        id: flaky_budget
        if: always()
        run: |
          if [ ! -f metrics/flaky.json ]; then
            echo "::error::Flaky metric unavailable (metrics/flaky.json missing)"
            exit 1
          fi

          FLAKY=$(jq -r '.flaky // empty' metrics/flaky.json)
          if [ -z "$FLAKY" ]; then
            echo "::error::Invalid flaky metric value in metrics/flaky.json"
            exit 1
          fi

          if [ "$FLAKY" -gt 1 ]; then
            echo "flaky_gt_one=true" >> "$GITHUB_OUTPUT"
          else
            echo "flaky_gt_one=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$FLAKY" -gt 3 ]; then
            echo "Too many flaky tests"
            exit 1
          fi

      - name: Ingest E2E metrics to Supabase
        if: always()
        run: node scripts/ingest-e2e-metrics.mjs

      # ===============================
      # Publish JUnit to GitHub Checks
      # ===============================
      - name: Publish test results (JUnit)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Report (${{ matrix.browser }})
          path: playwright-report/junit.xml
          reporter: java-junit
          fail-on-error: false

      # ===============================
      # Upload artifacts
      # ===============================
      - name: Upload Playwright artifacts
        if: ${{ failure() && steps.flaky_budget.outputs.flaky_gt_one == 'true' }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/


  # =====================================
  # 3️⃣ Lighthouse Lighthouse - Performance, SEO & Accessibility Gate
  # =====================================
  lighthouse:
    name: Lighthouse - Performance, SEO & Accessibility Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: e2e
    env:
      VITE_BASE: "/"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            portfolio-chatbot/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build
        run: npm run build

      - name: Audit with Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.github/lighthouse/lighthouserc-ci.json
          uploadArtifacts: false
      
      - name: Generate Lighthouse summary
        if: always()
        run: |
          mkdir -p metrics
          echo "## 🔎 Lighthouse Gate" >> $GITHUB_STEP_SUMMARY
          node scripts/lighthouse-summary.mjs >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Upload Lighthouse metric
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lighthouse-score
          path: metrics/lighthouse.json
          if-no-files-found: warn
      
      - name: Debug lighthouse files
        if: always()
        run: ls -R .lighthouseci || true
      
      - name: Upload Lighthouse artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: lighthouse-report
          path: .lighthouseci
          if-no-files-found: ignore



  # =====================================
  # 4️⃣ Deploy (only if all verification passes)
  # =====================================
  deploy:
    needs: [backend, e2e, lighthouse]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            portfolio-chatbot/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build
        run: npm run build
        env:
          VITE_BASE: "/"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Download prev lighthouse-baseline run
        uses: dawidd6/action-download-artifact@v5
        continue-on-error: true
        with:
          workflow: deploy.yml
          branch: main
          name: lighthouse-baseline
          path: prev-metrics  

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ==============================
  # 5️⃣ PR Comment with Results
  # ==============================
      - name: Download current Lighthouse metric
        uses: actions/download-artifact@v5
        with:
          name: lighthouse-score
          path: metrics

      - name: Compute Lighthouse trend
        id: lhtrend
        run: |
          CURRENT=$(jq .score metrics/lighthouse.json)
          PREV="N/A"
          DELTA="N/A"

          if [ -f prev-metrics/lighthouse.json ]; then
            PREV=$(jq .score prev-metrics/lighthouse.json)
            if [ -n "$PREV" ] && [ "$PREV" != "null" ]; then
              DELTA=$(( CURRENT - PREV ))
              if   [ "$DELTA" -gt 0 ]; then DELTA="+${DELTA} ⬆️"
              elif [ "$DELTA" -lt 0 ]; then DELTA="${DELTA} ⬇️"
              else                          DELTA="${DELTA} ➡️"
              fi
            fi
          fi

          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "prev=$PREV"       >> $GITHUB_OUTPUT
          echo "delta=$DELTA"     >> $GITHUB_OUTPUT
          
      - name: Deployment quality summary
        run: |
          echo "## 📊 Release Quality Trend" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Lighthouse score: ${{ steps.lhtrend.outputs.current }}" >> $GITHUB_STEP_SUMMARY
          echo "- Previous deploy: ${{ steps.lhtrend.outputs.prev }}" >> $GITHUB_STEP_SUMMARY
          echo "- Trend: ${{ steps.lhtrend.outputs.delta }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Final deployment summary
        if: always()
        run: |
          echo "## 🚀 Deployment Result" >> $GITHUB_STEP_SUMMARY
          echo "- Static site deployed to GitHub Pages" >> $GITHUB_STEP_SUMMARY
          echo "- All verification gates passed before release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 Environment URL: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY

      # Upload current Lighthouse scores to calculate trend for next run 
      - name: Persist Lighthouse baseline for next deploy
        uses: actions/upload-artifact@v5
        with:
          name: lighthouse-baseline
          path: metrics/lighthouse.json
