name: Deployment Quality Gates

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  checks: write   # Needed for JUnit publishing

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

  # =====================================
  # 1️⃣ Backend Verification (Tier 2)
  # =====================================
  backend:
    name: Backend Tests (unit + contract)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            portfolio-chatbot/package-lock.json

      # Install root deps (if needed)
      - name: Install root deps
        run: npm ci --prefer-offline

      - name: Install backend deps
        run: |
          cd portfolio-chatbot
          npm ci --prefer-offline

      # Start Worker in background for contract test
      - name: Start Worker
        run: |
          cd portfolio-chatbot
          npm run dev > worker.log 2>&1 &
          npx wait-on tcp:127.0.0.1:8787 --timeout 40000

      # Run backend tests
      - name: Run backend tests
        run: |
          cd portfolio-chatbot
          npm run test:ci

      - name: Write backend summary
        if: always()
        run: |
          echo "## 🧠 Backend Verification" >> $GITHUB_STEP_SUMMARY
          echo "- Unit + contract tests executed" >> $GITHUB_STEP_SUMMARY
          echo "- Worker boot validation completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

  # =====================================
  # 2️⃣ Frontend E2E Multi-Browser
  # =====================================
  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    env:
      VITE_BASE: /

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            portfolio-chatbot/package-lock.json

      - name: Install deps
        run: npm ci --prefer-offline

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install browser
        run: npx playwright install ${{ matrix.browser }} --with-deps

      - name: Build
        run: npm run build
        env:
          VITE_BASE: "/"

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Generate E2E summary
        if: always()
        run: |
          node scripts/playwright-summary.mjs ${{ matrix.browser }} tmp.md
          cat tmp.md >> $GITHUB_STEP_SUMMARY

      # ===============================
      # Publish JUnit to GitHub Checks
      # ===============================
      - name: Publish test results (JUnit)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Report (${{ matrix.browser }})
          path: playwright-report/junit.xml
          reporter: java-junit

      # ===============================
      # Upload artifacts
      # ===============================
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/

      # ===============================
      # Generate summary snippet
      # ===============================
      - name: Write summary snippet
        if: always()
        run: node scripts/playwright-summary.mjs ${{ matrix.browser }} summaries/${{ matrix.browser }}.md


  # =====================================
  # 3️⃣ Lighthouse Lighthouse - Performance, SEO & Accessibility Gate
  # =====================================
  lighthouse:
    name: Lighthouse - Performance, SEO & Accessibility Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: e2e
    env:
      VITE_BASE: "/"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            portfolio-chatbot/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build
        run: npm run build

      - name: Audit with Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: false
      - name: Upload Lighthouse metric
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-score
          path: metrics/lighthouse.json
      
      - name: Upload Lighthouse artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci

      - name: Generate Lighthouse summary
        if: always()
        run: node scripts/lighthouse-summary.mjs >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY

  # =====================================
  # 4️⃣ Deploy (only if all verification passes)
  # =====================================
  deploy:
    needs: [backend, e2e, lighthouse]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            portfolio-chatbot/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build
        run: npm run build
        env:
          VITE_BASE: "/"

      - name: Download previous Lighthouse score
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: deployment-quality-gates.yml
          branch: main
          name: lighthouse-score
          path: prev-metrics  

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ==============================
  # 5️⃣ PR Comment with Results
  # ==============================
      - name: Compute Lighthouse trend
        id: lhtrend
        run: |
          CURRENT=$(cat metrics/lighthouse.json | jq .score)

          if [ "$DELTA" != "N/A" ]; then
            if [ "$DELTA" -gt 0 ]; then ICON="⬆️"
            elif [ "$DELTA" -lt 0 ]; then ICON="⬇️"
            else ICON="➡️"
            fi
          fi

          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "prev=$PREV" >> $GITHUB_OUTPUT
          echo "delta=$DELTA" >> $GITHUB_OUTPUT
          
      - name: Deployment quality summary
        run: |
          echo "## 📊 Release Quality Trend" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Lighthouse score: ${{ steps.lhtrend.outputs.current }}" >> $GITHUB_STEP_SUMMARY
          echo "- Previous deploy: ${{ steps.lhtrend.outputs.prev }}" >> $GITHUB_STEP_SUMMARY
          echo "- Trend: ${{ steps.lhtrend.outputs.delta }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Final deployment summary
        if: always()
        run: |
          echo "## 🚀 Deployment Result" >> $GITHUB_STEP_SUMMARY
          echo "- Static site deployed to GitHub Pages" >> $GITHUB_STEP_SUMMARY
          echo "- All verification gates passed before release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 Environment URL: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY

      # Upload current Lighthouse scores to calculate trend for next run 
      - name: Persist Lighthouse score
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-score
          path: metrics/lighthouse.json