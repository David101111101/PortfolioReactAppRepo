name: Weekly Regression Suite - Production Endpoint

on:
  schedule:
    - cron: "0 1 * * 3"   # Wednesday 1AM UTC
  workflow_dispatch:

permissions:
  contents: write
  checks: write
  issues: write

jobs:
  backend-weekly-regression:
    environment: github-pages
    name: Production Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NIGHTLY: "true"
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      WORKFLOW_TYPE: weekly_regression_suite

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            portfolio-chatbot/package-lock.json

      - name: Install dependencies
        run: |
          cd portfolio-chatbot
          npm ci --prefer-offline

      - name: Validate API_BASE_URL
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "API_BASE_URL is empty"
            exit 1
          fi

      - name: Run regression suite (production endpoint)
        run: |
          cd portfolio-chatbot
          API_BASE_URL=$API_BASE_URL npm run test:ci

      # Publish JUnit results
      - name: Publish backend test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Regression Suite Results
          path: portfolio-chatbot/junit.xml
          reporter: java-junit

      # Upload artifacts
      - name: Upload regression artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Backend Regression Suite Results
          path: |
            portfolio-chatbot/junit.xml
            portfolio-chatbot/playwright-report/
            portfolio-chatbot/test-results/

      - name: Upload regression artifacts (structured)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-artifacts
          path: portfolio-chatbot/artifacts/

      - name: Upload metrics to database
        if: always()
        run: |
          cd portfolio-chatbot
          node scripts/upload-metrics.js

      - name: Evaluate regression gate
        id: regression_gate
        continue-on-error: true
        run: |
          node << 'EOF'
          const fs = require("fs");
          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_KEY = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const RUN_ID = process.env.DB_RUN_ID;

          async function fetchJSON(url, options = {}) {
            const res = await fetch(url, {
              headers: {
                apikey: SUPABASE_KEY,
                Authorization: `Bearer ${SUPABASE_KEY}`
              }
            });
            if (!res.ok) {
              const text = await res.text();
              throw new Error(text);
            }
            return res.json();
          }

          async function main() {

            // Analysis computed in DB through a function
            const [analysis] = await fetchJSON(
              `${SUPABASE_URL}/rest/v1/regression_story?run_id=eq.${DB_RUN_ID}`
            );

            if (!analysis || analysis.latency_delta === null) {
              console.log("Not enough historical data → skipping regression evaluation");
              return;
            }

            if (analysis.regression_severity === "critical" || analysis.regression_severity === "moderate") {
              console.log("🚨 Regression detected via DB intelligence layer");
              process.exit(1);
            }
          }

          main().catch(err => {
            console.error("⚠️ Regression gate failed due to infra error:");
            console.error(err);
            // Do NOT fail pipeline for infra issues
            process.exit(0);
          });
          EOF

      - name: Capture regression status
        if: always()
        run: |
          if [ "${{ job.status }}" = "failure" ]; then
            echo "REGRESSION_STATUS=FAIL" >> $GITHUB_ENV
          else
            echo "REGRESSION_STATUS=PASS" >> $GITHUB_ENV
          fi
      
      - name: Record failure events
        if: failure()
        run: |
          node << 'EOF'
          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_KEY = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const RUN_ID = process.env.DB_RUN_ID;

          async function insertFailure(event) {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/failure_events`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                apikey: SUPABASE_KEY,
                Authorization: `Bearer ${SUPABASE_KEY}`
              },
              body: JSON.stringify(event)
            });

            if (!res.ok) {
              const text = await res.text();
              throw new Error(text);
            }
          }

          async function main() {
          if (!RUN_ID) {
            console.log("⚠️ No DB_RUN_ID available, skipping failure event insert");
            return;
          }
            const events = [
              {
                run_id: RUN_ID,
                test_id: "regression_gate",
                classification: "system_regression",
                root_signal: "latency|retrieval|rate_limit"
              }
            ];

            for (const e of events) {
              await insertFailure(e);
            }

            console.log("Failure events recorded");
          }

          main().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF

      # Dashboard
      - name: Compare with previous runs from DB
        continue-on-error: true
        id: dbcompare
        run: |
          node << 'EOF'
          const fs = require("fs");
          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_KEY = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const RUN_ID = process.env.DB_RUN_ID;

          async function fetchJSON(url) {
            const res = await fetch(url, {
              headers: {
                apikey: SUPABASE_KEY,
                Authorization: `Bearer ${SUPABASE_KEY}`
              }
            });

            if (!res.ok) {
              const text = await res.text();
              throw new Error(text);
            }

            return res.json();
          }
          async function safeFetch(url, fallback = []) {
            try {
              return await fetchJSON(url);
            } catch (e) {
              console.log(`⚠️ Warning: failed to fetch ${url}`);
              console.log(e.message);
              return fallback;
            }
          }

          async function main() {
            // 🔥 Query the interpretation posgress view layer (NOT raw tables)
            const flakiness = await safeFetch(
              `${SUPABASE_URL}/rest/v1/flakiness_run_summary?run_id=eq.${DB_RUN_ID}`,
              []
            );
            const f = flakiness[0];
            const trend = await safeFetch(
            `${SUPABASE_URL}/rest/v1/flakiness_trend?workflow_type=eq.weekly_regression_suite&order=run_timestamp.desc&limit=5`,
            []
          );

          const flakinessTrend = trend
          .map(t => {
            const delta = t.flakiness_delta ?? 0;
            const direction = delta > 0 ? "↑" : delta < 0 ? "↓" : "→";
            const date = t.run_timestamp ? t.run_timestamp.slice(5,10) : "N/A";
            return `${date} (${t.flakiness_pct}% ${direction})`;
          })
          .join(", ");

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `flakiness_pct=${f?.flakiness_pct ?? 0}\n`);

            const flakyTests = await safeFetch(
              `${SUPABASE_URL}/rest/v1/test_flakiness_enriched?order=flakiness_pct.desc&limit=5`,
              []
            );

            const flakyList = flakyTests
              .map(t => `${t.test_id} (${t.flakiness_pct}%, ${t.severity}, ${t.recency})`)
              .join("||") || "none";

            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `flaky_tests<<EOF\n${flakyList}\nEOF\n`
            );

            const workflowStability = await safeFetch(
              `${SUPABASE_URL}/rest/v1/e2e_workflow_stability`,
              []
            );
            const stabilityLines = workflowStability.map(w => {
              const label = w.workflow_type === "pr_e2e" ? "PR" : "Deploy";
              const trendIcon = w.trend_direction === "improving" ? "✅"
                : w.trend_direction === "degrading" ? "🚨" : "➡️";
              const flag = w.avg_flakiness_pct > 3 ? " ⚠️" : "";
              return `${label} trend: ${w.trend_direction} ${trendIcon} (current: ${w.avg_flakiness_pct}%, prev: ${w.prev_flakiness_pct ?? "N/A"}%, ${w.run_count} runs)${flag}`;
            }).join("\n") || "no e2e data yet";
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `workflow_stability<<EOF\n${stabilityLines}\nEOF\n`
            );

            const e2eTrend = await safeFetch(
              `${SUPABASE_URL}/rest/v1/flakiness_trend?workflow_type=in.(pr_e2e,deploy_e2e)&order=run_timestamp.desc&limit=5`,
              []
            );
            const [latestE2E, prevE2E] = [e2eTrend[0], e2eTrend[1]];
            const e2eDelta = latestE2E && prevE2E && prevE2E.flakiness_pct != null
              ? (latestE2E.flakiness_pct - prevE2E.flakiness_pct).toFixed(1)
              : "N/A";
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `e2e_flakiness_current=${latestE2E?.flakiness_pct ?? "N/A"}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `e2e_flakiness_prev=${prevE2E?.flakiness_pct ?? "N/A"}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `e2e_flakiness_delta=${e2eDelta}\n`);

            const langs = await safeFetch(
              `${SUPABASE_URL}/rest/v1/retrieval_language_summary?run_id=eq.${DB_RUN_ID}`,
              []
            );
            const langSummary = langs
              .map(l => `${l.language}: avg=${l.avg_confidence}, min=${l.min_confidence}`)
              .join(" | ");

            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `languages<<EOF\n${langSummary}\nEOF\n`
            );

            const riskyLangs = langs
              .filter(l => l.min_confidence < 40)
              .map(l => `${l.language} (${l.min_confidence})`);

            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `risky_languages<<EOF\n${riskyLangs.join(",") || "none"}\nEOF\n`
            );

            let weakest = { language: "N/A", min_confidence: "N/A" };

            if (langs.length) {
              weakest = langs.reduce((min, l) =>
                l.min_confidence < min.min_confidence ? l : min
              );
            }

            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `weakest_language<<EOF\n${weakest.language} (${weakest.min_confidence})\nEOF\n`
            );
            
            const history = await safeFetch(
              `${SUPABASE_URL}/rest/v1/regression_run_summary?order=run_timestamp.desc&limit=5`,
              []
            );

            const trendLines = history.map(r => {
              const date = new Date(r.run_timestamp).toISOString().slice(5, 10);
              return `- ${date} | Latency:${r.p95_latency}ms | Confidence:${Math.round(r.avg_confidence)} | Reliability:${r.reliability_score}`;
            }).join("\n");

            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `trend_snapshot<<EOF\n${trendLines}\nEOF\n`
            );

            const data = await safeFetch(
              `${SUPABASE_URL}/rest/v1/regression_story?run_id=eq.${DB_RUN_ID}`,
              []
            );
            console.log("Regression story:", data);
            if (!data.length) {
              console.log("No comparison data available");

              fs.appendFileSync(process.env.GITHUB_OUTPUT, "trend=N/A\n");
              fs.appendFileSync(process.env.GITHUB_OUTPUT, "severity=N/A\n");
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `reliability_score=N/A\n`);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `p95_latency=N/A\n`);

                const defaults = {
                    latency_delta: "N/A",
                    latency_pct: "N/A",
                    confidence_delta: "N/A",
                    confidence_pct: "N/A",
                    reliability_delta: "N/A",
                    trend: "N/A",
                    severity: "N/A",
                    signal: "N/A",
                    reliability_score: "N/A",
                    avg_confidence: "N/A",
                    min_confidence: "N/A",
                    p95_latency: "N/A"
                };

                for (const [k, v] of Object.entries(defaults)) {
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, `${k}=${v}\n`);
                }
              return;
            }

            const r = data[0];

            // ✅ Export structured outputs for downstream steps
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `prev_latency=${r.prev_latency}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `latency_delta=${r.latency_delta}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `latency_pct=${r.latency_pct}\n`);

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `confidence_delta=${r.confidence_delta}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `confidence_pct=${r.confidence_pct}\n`);

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `reliability_delta=${r.reliability_delta}\n`);

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `trend=${r.trend_direction}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `severity=${r.regression_severity}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `signal=${r.primary_signal}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `analysis_confidence=${r.analysis_confidence}\n`);

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `p95_latency=${r.p95_latency}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `avg_confidence=${r.avg_confidence}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `reliability_score=${r.reliability_score}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `min_confidence=${r.min_confidence}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `min_confidence_delta=${r.min_confidence_delta ?? "N/A"}\n`);

            // classification shortcut
            const classification =
              r.primary_signal === "system_degradation"
                ? "system_degradation"
                : "no_major_issue";

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `classification=${classification}\n`);

            // 🧠 Human-readable log (helps debugging CI)
            console.log("---- Regression Story ----");
            console.log(`Latency Δ: ${r.latency_delta} (${(r.latency_pct * 100).toFixed(2)}%)`);
            console.log(`Confidence Δ: ${r.confidence_delta} (${(r.confidence_pct * 100).toFixed(2)}%)`);
            console.log(`Reliability Δ: ${r.reliability_delta}`);
            console.log(`Trend: ${r.trend_direction}`);
            console.log(`Severity: ${r.regression_severity}`);
            console.log(`Signal: ${r.primary_signal}`);
            console.log(`min_confidence=${r.min_confidence}`);
            console.log(`user_impact=${r.user_impact}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `baseline_deviation=N/A\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `deviation_severity=N/A\n`);

            const anomaly = await safeFetch(
              `${SUPABASE_URL}/rest/v1/regression_anomalies?run_id=eq.${DB_RUN_ID}`,
              []
            );
            console.log("Anomaly result:", anomaly);
            if (anomaly.length) {
              const a = anomaly[0];
              const z = a.latency_z;

              const severity =
                Math.abs(z) > 3 ? "critical" :
                Math.abs(z) > 2 ? "high" :
                Math.abs(z) > 1 ? "moderate" : "normal";
              
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `baseline_deviation=${z}\n`);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `deviation_severity=${severity}\n`);

              if (Math.abs(z) > 1) {
                const direction = z > 0 ? "higher" : "lower";
                console.log("---- Anomaly Detection ----");

                console.log(`📊 Metric: Latency (P95)`);
                console.log(`- Current: ${a.p95_latency} ms`);
                console.log(`- Baseline Deviation: ${z.toFixed(2)} (${severity})`);

                // Directional insight
                console.log(`Latency is ${Math.abs(z).toFixed(1)}x deviation from normal (${direction} than expected)`);
                
                if (r.primary_signal === "system_degradation" && Math.abs(z) > 2) {
                  console.log("🔥 Confirmed: anomaly aligns with system degradation signal");
                }

                // Correlation with regression signals
                if (z > 2 && a.p95_latency > 0) {
                  console.log(`🧩 Likely Impact:`);

                  if (a.p95_latency > 0) {
                    console.log(`- Increased response time may degrade retrieval ranking quality`);
                  }

                  console.log(`- Potential infrastructure or backend slowdown`);
                }

                console.log(`🧠 Interpretation:`);
                console.log(`Latency deviates ${Math.abs(z).toFixed(2)} standard deviations from normal behavior`);
              }
            }
            if (!anomaly.length) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `baseline_deviation=N/A\n`);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `deviation_severity=normal\n`);
            }
          };
          main().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF

      - name: Generating AI Regression Dashboard
        if: always()
        run: |
          echo "## 🧠 AI RAG System Weekly Health Report" >> $GITHUB_STEP_SUMMARY
          echo "Multisignal regression analysis across performance, retrieval quality, and anomaly detection." >> $GITHUB_STEP_SUMMARY

          echo "### 📊 System Health" >> $GITHUB_STEP_SUMMARY
          echo "- Status: $REGRESSION_STATUS" >> $GITHUB_STEP_SUMMARY
          echo "- Reliability Score: ${{ steps.dbcompare.outputs.reliability_score }}/100" >> $GITHUB_STEP_SUMMARY
          echo "- Trend: ${{ steps.dbcompare.outputs.trend }}" >> $GITHUB_STEP_SUMMARY
          echo "- Severity: ${{ steps.dbcompare.outputs.severity }}" >> $GITHUB_STEP_SUMMARY
          echo "- Analysis Confidence: ${{ steps.dbcompare.outputs.analysis_confidence }}" >> $GITHUB_STEP_SUMMARY
          echo "- Flakiness: ${{ steps.dbcompare.outputs.flakiness_pct }}%" >> $GITHUB_STEP_SUMMARY          
          if (( $(echo "${{ steps.dbcompare.outputs.flakiness_pct }} > 2" | bc -l) )); then
            echo "- ⚠️ Elevated flakiness detected → investigate test stability or system intermittency" >> $GITHUB_STEP_SUMMARY
            echo "- Most flaky tests: ${{ steps.dbcompare.outputs.flaky_tests }}" >> $GITHUB_STEP_SUMMARY
          fi
          if (( $(echo "${{ steps.dbcompare.outputs.flakiness_pct }} > 3" | bc -l) )); then
            echo "- ⚠️ Elevated flakiness detected → investigate test stability or system intermittency" >> $GITHUB_STEP_SUMMARY
          fi
          # Core interpretation
          MIN_CONF="${{ steps.dbcompare.outputs.min_confidence }}"
          LATENCY="${{ steps.dbcompare.outputs.p95_latency }}"
          SIGNAL="${{ steps.dbcompare.outputs.signal }}"
          SEVERITY="${{ steps.dbcompare.outputs.severity }}"
          TREND="${{ steps.dbcompare.outputs.trend }}"
          if [ "$REGRESSION_STATUS" = "FAIL" ]; then
            echo "- ❌ System instability detected during scheduled regression run" >> $GITHUB_STEP_SUMMARY

          elif [[ -n "$MIN_CONF" && "$MIN_CONF" != "N/A" ]] && awk "BEGIN {exit !($MIN_CONF < 70)}"; then
            echo "- ⚠️ Retrieval degradation detected → lowest ranking language: ${{ steps.dbcompare.outputs.weakest_language }} /100" >> $GITHUB_STEP_SUMMARY

          elif [ "$SEVERITY" = "moderate" ] || [ "$SEVERITY" = "critical" ]; then
            echo "- ⚠️ Performance or behavior drift detected vs historical baseline" >> $GITHUB_STEP_SUMMARY

          else
            echo "- ✅ System stable: no significant drift in performance or retrieval quality" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🧠 What Changed" >> $GITHUB_STEP_SUMMARY
          LATENCY_PCT="${{ steps.dbcompare.outputs.latency_pct }}"

          if [[ -n "$LATENCY_PCT" && "$LATENCY_PCT" != "N/A" ]]; then
            LAT_PCT=$(printf "%.2f" $(echo "$LATENCY_PCT * 100" | bc -l))
          else
            LAT_PCT="N/A"
          fi
          echo "- Latency: ${{ steps.dbcompare.outputs.p95_latency }} ms" >> $GITHUB_STEP_SUMMARY
          echo "- Change: ${LAT_PCT}% vs baseline (${{ steps.dbcompare.outputs.prev_latency }} ms)" >> $GITHUB_STEP_SUMMARY
          REL_DELTA="${{ steps.dbcompare.outputs.reliability_delta }}"

          if [ "$REL_DELTA" = "0" ]; then
            echo "- Reliability: stable vs previous run 👌" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Reliability increased: $REL_DELTA" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "### 📉 Last 5 Runs Trend" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.dbcompare.outputs.trend_snapshot }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📈 Trend Insight" >> $GITHUB_STEP_SUMMARY

          if [ "$TREND" = "improving" ]; then
            echo "- 📈 System improving over recent runs" >> $GITHUB_STEP_SUMMARY

          elif [ "$TREND" = "degrading" ]; then
            echo "- 📉 System showing degradation trend across recent runs" >> $GITHUB_STEP_SUMMARY

          elif [ "$SEVERITY" = "moderate" ] || [ "$SEVERITY" = "critical" ]; then
            echo "- ⚠️ Instability detected in recent runs" >> $GITHUB_STEP_SUMMARY

          else
            echo "- ➖ System stable with no significant trend shift" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.dbcompare.outputs.baseline_deviation }}" = "N/A" ]; then
            echo "- ℹ️ No anomaly detected (within normal variance)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Baseline Deviation: ..." >> ...
          fi
          echo "- Severity: ${{ steps.dbcompare.outputs.deviation_severity }}" >> $GITHUB_STEP_SUMMARY
          echo "- Analysis Confidence: ${{ steps.dbcompare.outputs.analysis_confidence }}" >> $GITHUB_STEP_SUMMARY

          echo "### 🧠 LLM Retrieval Quality" >> $GITHUB_STEP_SUMMARY
          echo "- Avg Confidence: ${{ steps.dbcompare.outputs.avg_confidence }}" >> $GITHUB_STEP_SUMMARY
          echo "- Min Confidence (worst case): ${{ steps.dbcompare.outputs.min_confidence }}" >> $GITHUB_STEP_SUMMARY
          CONF_PCT="${{ steps.dbcompare.outputs.confidence_pct }}"

          if [[ -n "$CONF_PCT" && "$CONF_PCT" != "N/A" ]]; then
            CONF_DELTA=$(printf "%.2f" $(echo "$CONF_PCT * 100" | bc -l))
          else
            CONF_DELTA="N/A"
          fi

          echo "- Δ Confidence: ${{ steps.dbcompare.outputs.confidence_delta }} (${CONF_DELTA}%)" >> $GITHUB_STEP_SUMMARY

          echo "### 🌍 Multilingual Retrieval stats" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.dbcompare.outputs.languages }}" >> $GITHUB_STEP_SUMMARY

          if [[ "$MIN_CONF" != "N/A" ]] && (( $(echo "$MIN_CONF < 40" | bc -l) )); then
            echo "### 🚨 Risk Indicator" >> $GITHUB_STEP_SUMMARY
            echo "- ⚠️ Low-confidence retrieval detected → potential incorrect answers in some languages" >> $GITHUB_STEP_SUMMARY
            echo "- Risky Languages: ${{ steps.dbcompare.outputs.risky_languages }}" >> $GITHUB_STEP_SUMMARY
            echo "- ⚠️ Weakest language: ${{ steps.dbcompare.outputs.weakest_language }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ✅ Consistent answer quality across supported languages" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🧪 Top Flaky Tests" >> $GITHUB_STEP_SUMMARY

          FLAKY_TESTS="${{ steps.dbcompare.outputs.flaky_tests }}"

          if [ -z "$FLAKY_TESTS" ] || [ "$FLAKY_TESTS" = "none" ]; then
            echo "- 🎉 Excellent: No flaky tests detected. Test suite is stable and reliable." >> $GITHUB_STEP_SUMMARY

          else
            COUNT=$(echo "$FLAKY_TESTS" | grep -o '||' | wc -l)
            COUNT=$((COUNT + 1))

            if [ "$COUNT" -eq 0 ]; then
              echo "- 🎉 Excellent: No flaky tests detected. Test suite is stable and reliable." >> $GITHUB_STEP_SUMMARY
            else
              echo "$FLAKY_TESTS" | tr '|' '\n' | sed '/^$/d' | sed 's/^ //' | while read -r line; do
                echo "- $line" >> $GITHUB_STEP_SUMMARY
              done
            fi
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔀 E2E Workflow Stability" >> $GITHUB_STEP_SUMMARY
          STABILITY="${{ steps.dbcompare.outputs.workflow_stability }}"
          if [ -z "$STABILITY" ] || [ "$STABILITY" = "no e2e data yet" ]; then
            echo "- ℹ️ E2E metrics not yet available (requires at least 1 PR or deploy run)" >> $GITHUB_STEP_SUMMARY
          else
            echo "$STABILITY" | while read -r line; do
              echo "- $line" >> $GITHUB_STEP_SUMMARY
            done
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📉 E2E Flakiness Trend" >> $GITHUB_STEP_SUMMARY
          E2E_CURR="${{ steps.dbcompare.outputs.e2e_flakiness_current }}"
          E2E_PREV="${{ steps.dbcompare.outputs.e2e_flakiness_prev }}"
          E2E_DELTA="${{ steps.dbcompare.outputs.e2e_flakiness_delta }}"
          if [ "$E2E_CURR" != "N/A" ] && [ -n "$E2E_CURR" ]; then
            echo "- Current: ${E2E_CURR}%" >> $GITHUB_STEP_SUMMARY
            echo "- Previous: ${E2E_PREV}%" >> $GITHUB_STEP_SUMMARY
            DELTA_NUM="${E2E_DELTA//+/}"
            if [[ "$E2E_DELTA" != "N/A" ]] && awk "BEGIN {exit !($DELTA_NUM > 0.5)}"; then
              echo "- Δ +${E2E_DELTA}% 🚨 (flakiness increasing)" >> $GITHUB_STEP_SUMMARY
            elif [[ "$E2E_DELTA" != "N/A" ]] && awk "BEGIN {exit !($DELTA_NUM < -0.5)}"; then
              echo "- Δ ${E2E_DELTA}% ✅ (flakiness decreasing)" >> $GITHUB_STEP_SUMMARY
            else
              echo "- Δ stable ➡️" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- ℹ️ No E2E trend data yet" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ job.status }}" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🧩 Root Cause Analysis" >> $GITHUB_STEP_SUMMARY

            SIGNAL="${{ steps.dbcompare.outputs.signal }}"

            if [ -z "$SIGNAL" ]; then
              echo "- ❌ Pipeline failure (API/infra), not a regression signal" >> $GITHUB_STEP_SUMMARY
              echo "- Check failed step logs for root cause" >> $GITHUB_STEP_SUMMARY

            elif [ "$SIGNAL" = "system_degradation" ]; then
              echo "- System degradation detected: latency increase correlates with retrieval confidence degradation" >> $GITHUB_STEP_SUMMARY

            elif [ "$SIGNAL" = "latency_regression" ]; then
              echo "- Backend performance regression detected" >> $GITHUB_STEP_SUMMARY

            elif [ "$SIGNAL" = "retrieval_regression" ]; then
              echo "- Retrieval quality regression detected (independent of latency)" >> $GITHUB_STEP_SUMMARY

            else
              echo "- Regression signal detected: $SIGNAL" >> $GITHUB_STEP_SUMMARY
            fi
          fi
      
      - name: Capture report
        run: |
          echo "REPORT<<EOF" >> $GITHUB_ENV
          cat $GITHUB_STEP_SUMMARY >> $GITHUB_ENV || echo "No summary content" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Debug REPORT
        run: |
          echo "$REPORT"

      - name: Create weekly regression report issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🧠 Weekly AI Quality Regression Report - ${process.env.REGRESSION_STATUS}`,
              body: process.env.REPORT
            });

