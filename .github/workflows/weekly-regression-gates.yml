name: Weekly Regression Suite - Production Endpoint

on:
  schedule:
    - cron: "0 1 * * 3"   # Wednesday 1AM UTC
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  issues: write

jobs:
  backend-weekly-regression:
    environment: github-pages
    name: Production Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NIGHTLY: "true"
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      WORKFLOW_TYPE: weekly_regression_suite

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            portfolio-chatbot/package-lock.json

      - name: Install dependencies
        run: |
          cd portfolio-chatbot
          npm ci --prefer-offline

      - name: Validate API_BASE_URL
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "API_BASE_URL is empty"
            exit 1
          fi
      - name: Generate RUN_ID
        id: run_id
        run: echo "RUN_ID=$(uuidgen)" >> $GITHUB_ENV

      #verify deployed API is alive
      - name: Health check deployed API
        id: health
        run: |
          START=$(date +%s%3N)
          curl --silent --show-error --fail "${API_BASE_URL}/health"
          END=$(date +%s%3N)
          LAT=$((END-START))
          echo "lat=$LAT" >> $GITHUB_OUTPUT


      - name: Run regression suite (production endpoint)
        run: |
          cd portfolio-chatbot
          API_BASE_URL=$API_BASE_URL npm run test:ci

      # Publish JUnit results
      - name: Publish backend test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Regression Suite Results
          path: portfolio-chatbot/junit.xml
          reporter: java-junit

      # Upload artifacts
      - name: Upload regression artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Backend Regression Suite Results
          path: |
            portfolio-chatbot/junit.xml
            portfolio-chatbot/playwright-report/
            portfolio-chatbot/test-results/

      - name: Capture regression status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "REGRESSION_STATUS=PASS" >> $GITHUB_ENV
          else
            echo "REGRESSION_STATUS=FAIL" >> $GITHUB_ENV
          fi

      - name: Upload regression artifacts (structured)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-artifacts
          path: portfolio-chatbot/artifacts/
      
      - name: Download previous regression artifacts
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: weekly-regression-gates.yml
          branch: main
          name: regression-artifacts
          path: prev-artifacts

      - name: Upload metrics to database
        if: always()
        run: |
          cd portfolio-chatbot
          node scripts/upload-metrics.js

      - name: Fetch regression summary
        id: summary
        run: |
          node << 'EOF'
          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_KEY = process.env.SUPABASE_SERVICE_ROLE_KEY;

          async function main() {
            const res = await fetch(
              `${SUPABASE_URL}/rest/v1/regression_run_summary?order=run_timestamp.desc&limit=1`,
              {
                headers: {
                  apikey: SUPABASE_KEY,
                  Authorization: `Bearer ${SUPABASE_KEY}`
                }
              }
            );

            const data = await res.json();
            const r = data[0];

            console.log(`p95=${r.p95_latency}`);
            console.log(`confidence=${r.avg_confidence}`);
            console.log(`enforcement=${r.enforcement_rate}`);
          }

          main();
          EOF

      # Dashboard
      - name: Compare with previous runs from DB
        id: dbcompare
        run: |
          node << 'EOF'
          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_KEY = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const RUN_ID = process.env.RUN_ID;

          async function rpc(fn, body) {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                apikey: SUPABASE_KEY,
                Authorization: `Bearer ${SUPABASE_KEY}`
              },
              body: JSON.stringify(body)
            });

            if (!res.ok) {
              const text = await res.text();
              throw new Error(text);
            }

            return res.json();
          }

          async function main() {
            // 1️⃣ Get previous run
            const prev = await rpc("get_previous_run", {
              current_run: RUN_ID
            });

            if (!prev.length) {
              console.log("latency_delta=N/A");
              return;
            }

            const prevRunId = prev[0].id;

            // 2️⃣ Get performance metrics
            const [currentPerf] = await rpc("get_performance_metrics", {
              run: RUN_ID
            });

            const [prevPerf] = await rpc("get_performance_metrics", {
              run: prevRunId
            });

            let latencyDelta = "N/A";

            if (currentPerf && prevPerf) {
              latencyDelta = currentPerf.p95_latency - prevPerf.p95_latency;
            }

            console.log(`latency_delta=${latencyDelta}`);
          }

          main().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF

      - name: Generate AI Regression Dashboard
        if: always()
        run: |
          echo "## 🧠 AI Regression Report" >> $GITHUB_STEP_SUMMARY

          echo "### 🧪 Test Status" >> $GITHUB_STEP_SUMMARY
          echo "- Status: $REGRESSION_STATUS" >> $GITHUB_STEP_SUMMARY

          echo "### 🌐 Environment" >> $GITHUB_STEP_SUMMARY
          echo "- Endpoint: $API_BASE_URL" >> $GITHUB_STEP_SUMMARY
          echo "- Run ID: $RUN_ID" >> $GITHUB_STEP_SUMMARY
          echo "- Date: $(date -u)" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 System Signals" >> $GITHUB_STEP_SUMMARY
          echo "- Retrieval stability: validated" >> $GITHUB_STEP_SUMMARY
          echo "- Performance latency: monitored" >> $GITHUB_STEP_SUMMARY
          echo "- Rate limiting enforcement: validated" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📉 Performance Trend (DB-based)" >> $GITHUB_STEP_SUMMARY
          echo "- P95 latency delta vs previous run: ${{ steps.dbcompare.outputs.latency_delta }} ms" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Release Confidence" >> $GITHUB_STEP_SUMMARY

          echo "### 📊 Key Metrics" >> $GITHUB_STEP_SUMMARY
          echo "- P95 latency: ${{ steps.summary.outputs.p95 }} ms" >> $GITHUB_STEP_SUMMARY
          echo "- Avg confidence: ${{ steps.summary.outputs.confidence }}" >> $GITHUB_STEP_SUMMARY
          echo "- Rate limit enforcement: ${{ steps.summary.outputs.enforcement }}" >> $GITHUB_STEP_SUMMARY

          if [ "$REGRESSION_STATUS" = "PASS" ]; then
            echo "✅ System is stable across retrieval, performance, and abuse protection" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Regression detected — investigation required" >> $GITHUB_STEP_SUMMARY
          fi

