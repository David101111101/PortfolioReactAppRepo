name: Weekly Regression Suite - Backend Focus

# This workflow runs a deep regression suite every Wednesday to catch any issues that may have slipped through PR checks, especially around backend rate limits and contract integrity. It focuses on running the full backend test suite in a "weekly mode" that enables additional tests and stricter assertions.
on:
  schedule:
    - cron: "0 1 * * 3"  # 1 AM UTC every Wednesday (once a week)
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  backend-weekly-regression:
    name: Backend Deep Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NIGHTLY: "true"  # Only run tests tagged with @nightly in the regression suite
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache node_modules
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: portfolio-chatbot/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('portfolio-chatbot/package-lock.json') }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"

      - name: Install backend deps
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          cd portfolio-chatbot
          npm ci

      # Start Worker in background and give it a moment to initialize before running tests if after 30 attempts it is not ready, fail the job
      - name: Start Worker
        run: |
          cd portfolio-chatbot

          echo "Starting worker..."
          npm run dev 2>&1 | tee worker.log &
          
          echo "Waiting for worker to be ready..."

          READY=false
          
          for i in {1..30}; do
                if curl -s -X POST http://127.0.0.1:8787 \
                  -H "Content-Type: application/json" \
                  -d '{"question":"health check"}' \
                  > /dev/null; then
                  
                  READY=true
                  echo "Worker ready"
                  break
                fi
                echo "Attempt $i: worker not ready yet..."
                sleep 2
              done

              if [ "$READY" = false ]; then
                echo "Worker failed to start within timeout"
                echo "------ Worker logs ------"
                cat worker.log
                exit 1
              fi
          
      - name: Print worker logs if tests fail
        if: failure()
        run: |
          echo "------ Worker Logs ------"
          cat portfolio-chatbot/worker.log

      - name: Run backend tests (Regression weekly mode)
        run: |
          cd portfolio-chatbot
          npm run test:ci

      # Publish JUnit test results to guthub UI
      - name: Publish backend test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Regression Suite Results
          path: portfolio-chatbot/junit.xml
          reporter: java-junit

      #Upload artifacts for debugging 
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backend Regression Suite Results
          path: |
            portfolio-chatbot/junit.xml

      - name: Upload worker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-logs
          path: portfolio-chatbot/worker.log

      - name: Generate Regression Dashboard
        if: always()
        run: |
          echo "# 🧪 Weekly AI Backend Regression Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Environment" >> $GITHUB_STEP_SUMMARY
          echo "- Runner: ubuntu-latest" >> $GITHUB_STEP_SUMMARY
          echo "- Node: $(node -v)" >> $GITHUB_STEP_SUMMARY
          echo "- Date: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Test Suite Coverage" >> $GITHUB_STEP_SUMMARY
          echo "- Rate limiting enforcement" >> $GITHUB_STEP_SUMMARY
          echo "- RAG retrieval regression" >> $GITHUB_STEP_SUMMARY
          echo "- Backend contract validation" >> $GITHUB_STEP_SUMMARY
          echo "- LLM latency benchmarking" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🤖 LLM Latency Monitoring" >> $GITHUB_STEP_SUMMARY

          if grep -r "llm_latency_warning" . ; then
            echo "⚠️ LLM latency regression detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ LLM latency within expected range" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 🔬 Latency Telemetry" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          grep rag_latency -r . || echo "No telemetry found"
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### System Checks:" >> $GITHUB_STEP_SUMMARY
          echo "- Rate limit enforcement validated" >> $GITHUB_STEP_SUMMARY
          echo "- Contract integrity checked" >> $GITHUB_STEP_SUMMARY
          echo "- RAG retrieval regression executed" >> $GITHUB_STEP_SUMMARY
          echo "- AI latency benchmarking executed" >> $GITHUB_STEP_SUMMARY
          echo "- Performance telemetry collected" >> $GITHUB_STEP_SUMMARY 
