name: Weekly Regression Suite - Production Endpoint

on:
  schedule:
    - cron: "0 1 * * 3"   # Wednesday 1AM UTC
  workflow_dispatch:

permissions:
  contents: write
  checks: write
  issues: write
  pages: write
  id-token: write

jobs:
  backend-weekly-regression:
    environment: github-pages
    name: Production Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NIGHTLY: "true"
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      WORKFLOW_TYPE: weekly_regression_suite

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            portfolio-chatbot/package-lock.json

      - name: Install dependencies
        run: |
          cd portfolio-chatbot
          npm ci --prefer-offline

      - name: Validate API_BASE_URL
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "API_BASE_URL is empty"
            exit 1
          fi

      - name: Run regression suite (production endpoint)
        run: |
          cd portfolio-chatbot
          API_BASE_URL=$API_BASE_URL npm run test:ci

      # Publish JUnit results
      - name: Publish backend test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Regression Suite Results
          path: portfolio-chatbot/junit.xml
          reporter: java-junit

      # Upload artifacts
      - name: Upload regression artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Backend Regression Suite Results
          path: |
            portfolio-chatbot/junit.xml
            portfolio-chatbot/playwright-report/
            portfolio-chatbot/test-results/

      - name: Upload regression artifacts (structured)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-artifacts
          path: portfolio-chatbot/artifacts/

      - name: Upload metrics to database
        if: always()
        run: |
          cd portfolio-chatbot
          node scripts/upload-metrics.js

      - name: Evaluate regression gate
        id: regression_gate
        continue-on-error: true
        run: |
          node << 'EOF'
          const fs = require("fs");
          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_KEY = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const RUN_ID = process.env.DB_RUN_ID;

          async function fetchJSON(url, options = {}) {
            const res = await fetch(url, {
              headers: {
                apikey: SUPABASE_KEY,
                Authorization: `Bearer ${SUPABASE_KEY}`
              }
            });
            if (!res.ok) {
              const text = await res.text();
              throw new Error(text);
            }
            return res.json();
          }

          async function main() {

            // Analysis computed in DB through a function
            const [analysis] = await fetchJSON(
              `${SUPABASE_URL}/rest/v1/regression_story?run_id=eq.${RUN_ID}`
            );

            if (!analysis || analysis.latency_delta === null) {
              console.log("Not enough historical data → skipping regression evaluation");
              return;
            }

            if (analysis.regression_severity === "critical" || analysis.regression_severity === "moderate") {
              console.log("🚨 Regression detected via DB intelligence layer");
              process.exit(1);
            }
          }

          main().catch(err => {
            console.error("⚠️ Regression gate failed due to infra error:");
            console.error(err);
            // Do NOT fail pipeline for infra issues
            process.exit(0);
          });
          EOF

      - name: Capture regression status
        if: always()
        run: |
          if [ "${{ job.status }}" = "failure" ]; then
            echo "REGRESSION_STATUS=FAIL" >> $GITHUB_ENV
          else
            echo "REGRESSION_STATUS=PASS" >> $GITHUB_ENV
          fi
      
      - name: Record failure events
        if: failure()
        run: |
          node << 'EOF'
          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_KEY = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const RUN_ID = process.env.DB_RUN_ID;

          async function insertFailure(event) {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/failure_events`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                apikey: SUPABASE_KEY,
                Authorization: `Bearer ${SUPABASE_KEY}`
              },
              body: JSON.stringify(event)
            });

            if (!res.ok) {
              const text = await res.text();
              throw new Error(text);
            }
          }

          async function main() {
          if (!RUN_ID) {
            console.log("⚠️ No DB_RUN_ID available, skipping failure event insert");
            return;
          }
            const events = [
              {
                run_id: RUN_ID,
                test_id: "regression_gate",
                classification: "system_regression",
                root_signal: "latency|retrieval|rate_limit"
              }
            ];

            for (const e of events) {
              await insertFailure(e);
            }

            console.log("Failure events recorded");
          }

          main().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF

      # Dashboard
      - name: Compare with previous runs from DB
        continue-on-error: true
        id: dbcompare
        run: |
          node << 'EOF'
          const fs = require("fs");
          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_KEY = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const RUN_ID = process.env.DB_RUN_ID;

          async function fetchJSON(url) {
            const res = await fetch(url, {
              headers: {
                apikey: SUPABASE_KEY,
                Authorization: `Bearer ${SUPABASE_KEY}`
              }
            });

            if (!res.ok) {
              const text = await res.text();
              throw new Error(text);
            }

            return res.json();
          }
          async function safeFetch(url, fallback = []) {
            try {
              return await fetchJSON(url);
            } catch (e) {
              console.log(`⚠️ Warning: failed to fetch ${url}`);
              console.log(e.message);
              return fallback;
            }
          }

          async function main() {
            // 🔥 Query the interpretation posgress view layer (NOT raw tables)
            const flakiness = await safeFetch(
              `${SUPABASE_URL}/rest/v1/flakiness_run_summary?run_id=eq.${RUN_ID}`,
              []
            );
            const f = flakiness[0];
            const trend = await safeFetch(
            `${SUPABASE_URL}/rest/v1/flakiness_trend?workflow_type=eq.weekly_regression_suite&order=run_timestamp.desc&limit=5`,
            []
          );

          const flakinessTrend = trend
          .map(t => {
            const delta = t.flakiness_delta ?? 0;
            const direction = delta > 0 ? "↑" : delta < 0 ? "↓" : "→";
            const date = t.run_timestamp ? t.run_timestamp.slice(5,10) : "N/A";
            return `${date} (${t.flakiness_pct}% ${direction})`;
          })
          .join(", ");

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `flakiness_pct=${f?.flakiness_pct ?? 0}\n`);

            const flakyTests = await safeFetch(
              `${SUPABASE_URL}/rest/v1/test_flakiness_enriched?order=flakiness_pct.desc&limit=5`,
              []
            );

            const flakyList = flakyTests
              .map(t => `${t.test_id} (${t.flakiness_pct}%, ${t.severity}, ${t.recency})`)
              .join("||") || "none";

            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `flaky_tests<<EOF\n${flakyList}\nEOF\n`
            );

            const workflowStability = await safeFetch(
              `${SUPABASE_URL}/rest/v1/e2e_workflow_stability`,
              []
            );
            const stabilityLines = workflowStability.map(w => {
              const label = w.workflow_type === "pr_e2e" ? "PR" : "Deploy";
              const trendIcon = w.trend_direction === "improving" ? "✅"
                : w.trend_direction === "degrading" ? "🚨" : "➡️";
              const flag = w.avg_flakiness_pct > 3 ? " ⚠️" : "";
              return `${label} workflow trend: ${w.trend_direction} ${trendIcon} (current: ${w.avg_flakiness_pct}%, prev: ${w.prev_flakiness_pct ?? "N/A"}%, ${w.run_count} runs)${flag}`;
            }).join("\n") || "No e2e data yet";
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `workflow_stability<<EOF\n${stabilityLines}\nEOF\n`
            );

            const e2eTrend = await safeFetch(
              `${SUPABASE_URL}/rest/v1/flakiness_trend?workflow_type=in.(pr_e2e,deploy_e2e)&order=run_timestamp.desc&limit=5`,
              []
            );
            const [latestE2E, prevE2E] = [e2eTrend[0], e2eTrend[1]];
            const e2eDelta = latestE2E && prevE2E && prevE2E.flakiness_pct != null
              ? (latestE2E.flakiness_pct - prevE2E.flakiness_pct).toFixed(1)
              : "N/A";
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `e2e_flakiness_current=${latestE2E?.flakiness_pct ?? "N/A"}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `e2e_flakiness_prev=${prevE2E?.flakiness_pct ?? "N/A"}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `e2e_flakiness_delta=${e2eDelta}\n`);

            const langs = await safeFetch(
              `${SUPABASE_URL}/rest/v1/retrieval_language_summary?run_id=eq.${RUN_ID}`,
              []
            );
            const langSummary = langs
              .map(l => `${l.language}: avg=${l.avg_confidence}, min=${l.min_confidence}`)
              .join(" | ");

            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `languages<<EOF\n${langSummary}\nEOF\n`
            );

            const riskyLangs = langs
              .filter(l => l.min_confidence < 40)
              .map(l => `${l.language} (${l.min_confidence})`);

            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `risky_languages<<EOF\n${riskyLangs.join(",") || "none"}\nEOF\n`
            );

            let weakest = { language: "N/A", min_confidence: "N/A" };

            if (langs.length) {
              weakest = langs.reduce((min, l) =>
                l.min_confidence < min.min_confidence ? l : min
              );
            }

            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `weakest_language<<EOF\n${weakest.language} (${weakest.min_confidence})\nEOF\n`
            );

            const langTrend = await safeFetch(
              `${SUPABASE_URL}/rest/v1/retrieval_language_trend?order=run_id.desc&limit=20`,
              []
            );

            // group last 5 per language
            const grouped = {};
            for (const l of langTrend) {
              if (!grouped[l.language]) grouped[l.language] = [];
              if (grouped[l.language].length < 5) {
                const arrow = l.delta > 0 ? "↑" : l.delta < 0 ? "↓" : "→";
                grouped[l.language].push(`${l.avg_confidence}${arrow}`);
              }
            }

            const trendSummary = Object.entries(grouped)
              .map(([lang, vals]) => `${lang}: ${vals.join(" → ")}`)
              .join(" | ");

            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `language_trend<<EOF\n${trendSummary}\nEOF\n`
            );
            
            const history = await safeFetch(
              `${SUPABASE_URL}/rest/v1/regression_run_summary?order=run_timestamp.desc&limit=5`,
              []
            );

            const trendLines = history.map(r => {
              const date = new Date(r.run_timestamp).toISOString().slice(5, 10);
              return `- ${date} | Latency:${r.p95_latency}ms | Confidence:${Math.round(r.avg_confidence)} | Reliability:${r.reliability_score}`;
            }).join("\n");

            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `trend_snapshot<<EOF\n${trendLines}\nEOF\n`
            );

            const data = await safeFetch(
              `${SUPABASE_URL}/rest/v1/regression_story?run_id=eq.${RUN_ID}`,
              []
            );
            console.log("Regression story:", data);
            if (!data.length) {
              console.log("No comparison data available");

              fs.appendFileSync(process.env.GITHUB_OUTPUT, "trend=N/A\n");
              fs.appendFileSync(process.env.GITHUB_OUTPUT, "severity=N/A\n");
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `reliability_score=N/A\n`);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `p95_latency=N/A\n`);

                const defaults = {
                    latency_delta: "N/A",
                    latency_pct: "N/A",
                    confidence_delta: "N/A",
                    confidence_pct: "N/A",
                    reliability_delta: "N/A",
                    trend: "N/A",
                    severity: "N/A",
                    signal: "N/A",
                    reliability_score: "N/A",
                    avg_confidence: "N/A",
                    min_confidence: "N/A",
                    p95_latency: "N/A"
                };

                for (const [k, v] of Object.entries(defaults)) {
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, `${k}=${v}\n`);
                }
              return;
            }

            const r = data[0];

            // ✅ Export structured outputs for downstream steps
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `prev_latency=${r.prev_latency}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `latency_delta=${r.latency_delta}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `latency_pct=${r.latency_pct}\n`);

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `confidence_delta=${r.confidence_delta}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `confidence_pct=${r.confidence_pct}\n`);

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `reliability_delta=${r.reliability_delta}\n`);

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `trend=${r.trend_direction}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `severity=${r.regression_severity}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `signal=${r.primary_signal}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `analysis_confidence=${r.analysis_confidence}\n`);

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `p95_latency=${r.p95_latency}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `avg_confidence=${r.avg_confidence}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `reliability_score=${r.reliability_score}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `min_confidence=${r.min_confidence}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `min_confidence_delta=${r.min_confidence_delta ?? "N/A"}\n`);

            // classification shortcut
            const classification =
              r.primary_signal === "system_degradation"
                ? "system_degradation"
                : "no_major_issue";

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `classification=${classification}\n`);

            // 🧠 Human-readable log (helps debugging CI)
            console.log("---- Regression Story ----");
            console.log(`Latency Δ: ${r.latency_delta} (${(r.latency_pct * 100).toFixed(2)}%)`);
            console.log(`Confidence Δ: ${r.confidence_delta} (${(r.confidence_pct * 100).toFixed(2)}%)`);
            console.log(`Reliability Δ: ${r.reliability_delta}`);
            console.log(`Trend: ${r.trend_direction}`);
            console.log(`Severity: ${r.regression_severity}`);
            console.log(`Signal: ${r.primary_signal}`);
            console.log(`min_confidence=${r.min_confidence}`);
            console.log(`user_impact=${r.user_impact}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `baseline_deviation=N/A\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `deviation_severity=N/A\n`);

            const anomaly = await safeFetch(
              `${SUPABASE_URL}/rest/v1/regression_anomalies?run_id=eq.${RUN_ID}`,
              []
            );
            console.log("Anomaly result:", anomaly);
            if (anomaly.length) {
              const a = anomaly[0];
              const z = a.latency_z;

              const severity =
                Math.abs(z) > 3 ? "critical" :
                Math.abs(z) > 2 ? "high" :
                Math.abs(z) > 1 ? "moderate" : "normal";
              
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `baseline_deviation=${z}\n`);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `deviation_severity=${severity}\n`);

              if (Math.abs(z) > 1) {
                const direction = z > 0 ? "higher" : "lower";
                console.log("---- Anomaly Detection ----");

                console.log(`📊 Metric: Latency (P95)`);
                console.log(`- Current: ${a.p95_latency} ms`);
                console.log(`- Baseline Deviation: ${z.toFixed(2)} (${severity})`);

                // Directional insight
                console.log(`Latency is ${Math.abs(z).toFixed(1)}x deviation from normal (${direction} than expected)`);
                
                if (r.primary_signal === "system_degradation" && Math.abs(z) > 2) {
                  console.log("🔥 Confirmed: anomaly aligns with system degradation signal");
                }

                // Correlation with regression signals
                if (z > 2 && a.p95_latency > 0) {
                  console.log(`🧩 Likely Impact:`);

                  if (a.p95_latency > 0) {
                    console.log(`- Increased response time may degrade retrieval ranking quality`);
                  }

                  console.log(`- Potential infrastructure or backend slowdown`);
                }

                console.log(`🧠 Interpretation:`);
                console.log(`Latency deviates ${Math.abs(z).toFixed(2)} standard deviations from normal behavior`);
              }
            }
            if (!anomaly.length) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `baseline_deviation=N/A\n`);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `deviation_severity=normal\n`);
            }
          };
          main().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF

      - name: Generate AI Regression Dashboard (HTML)
        if: always()
        run: |
            mkdir -p site
            REPORT_FILE=site/index.html

            STATUS="${REGRESSION_STATUS}"
            REL="${{ steps.dbcompare.outputs.reliability_score }}"
            TREND="${{ steps.dbcompare.outputs.trend }}"
            SEVERITY="${{ steps.dbcompare.outputs.severity }}"
            FLAKE="${{ steps.dbcompare.outputs.flakiness_pct }}"
            LANGS="${{ steps.dbcompare.outputs.languages }}"
            LANG_TREND="${{ steps.dbcompare.outputs.language_trend }}"
            TREND_SNAPSHOT="${{ steps.dbcompare.outputs.trend_snapshot }}"
            LATENCY="${{ steps.dbcompare.outputs.p95_latency }}"
            LATENCY_DELTA="${{ steps.dbcompare.outputs.latency_pct }}"
            REL_DELTA="${{ steps.dbcompare.outputs.reliability_delta }}"
            # Extract reliability values (basic parsing)
            TREND_DATA=$(echo "$TREND_SNAPSHOT" | grep -o 'Reliability:[0-9]*' | grep -o '[0-9]*' | tr '\n' ',' | sed 's/,$//')

            # Color logic
            if [ "$STATUS" = "PASS" ]; then STATUS_CLASS="ok"; else STATUS_CLASS="warn"; fi

            cat <<EOF > $REPORT_FILE
            <!DOCTYPE html>
            <html>
            <head>
            <meta charset="UTF-8">
            <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>AI Regression Dashboard</title>

            <style>
            :root {
              --bg: #0b1020;
              --panel: rgb(255 255 255 / 6%);
              --soft: rgb(255 255 255 / 12%);
              --text: rgb(255 255 255 / 92%);
              --muted: rgb(255 255 255 / 70%);
              --accent2: #06b6d4;
              --ok: #22c55e;
              --warn: #f59e0b;
              --radius: 16px;
              --shadow: 5px 5px 5px #00000059, 3px 5px 10px #00000059;
              --max: 1100px;
            }

            body {
              margin: 0;
              background:
                radial-gradient(1200px 600px at 10% 0%, rgb(124 58 237 / 22%), transparent 60%),
                radial-gradient(1000px 500px at 90% 20%, rgb(6 182 212 / 18%), transparent 55%),
                var(--bg);
              color: var(--text);
              font-family: system-ui;
            }

            .container {
              max-width: var(--max);
              margin: auto;
              padding: 40px 20px;
            }

            .card {
              background: var(--panel);
              border: 1px solid var(--soft);
              border-radius: var(--radius);
              box-shadow: var(--shadow);
              padding: 20px;
              margin-bottom: 20px;
            }
            
            canvas {
              width: 100%;
              margin-top: 10px;
            }

            .grid {
              display: grid;
              grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
              gap: 16px;
            }

            .metric {
              font-size: 26px;
              font-weight: bold;
            }

            .ok { color: var(--ok); }
            .warn { color: var(--warn); }

            .small { color: var(--muted); font-size: 14px; }

            .spark {
              font-family: monospace;
              color: var(--accent2);
            }
            </style>
            </head>

            <body>
            <div class="container">

            <!-- HEADER -->
            <div class="card">
              <h1>🧠 AI RAG System Health</h1>
              <p class="small">Multisignal regression observability across latency, retrieval, and multilingual drift</p>
            </div>

            <!-- CORE METRICS -->
            <div class="grid">
              <div class="card">
                <div>Status</div>
                <div class="metric ${STATUS_CLASS}">$STATUS</div>
              </div>

              <div class="card">
                <div>Reliability</div>
                <div class="metric">$REL / 100</div>
              </div>

              <div class="card">
                <div>Trend</div>
                <div class="metric">$TREND</div>
              </div>

              <div class="card">
                <div>Flakiness</div>
                <div class="metric">$FLAKE%</div>
              </div>
            </div>

            <!-- SYSTEM INTERPRETATION -->
            <div class="card">
              <h2>🧠 System Interpretation</h2>
            EOF

                if [ "$STATUS" = "FAIL" ]; then
                  echo "<p class='warn'>❌ System instability detected</p>" >> $REPORT_FILE
                elif (( $(echo "$FLAKE > 2" | bc -l) )); then
                  echo "<p class='warn'>⚠️ Elevated flakiness detected</p>" >> $REPORT_FILE
                else
                  echo "<p class='ok'>✅ System stable</p>" >> $REPORT_FILE
                fi

                cat <<EOF >> $REPORT_FILE
            </div>
            <!-- What changed recently? -->
            cat <<EOF >> $REPORT_FILE

            <div class="card">
              <h2>🧠 What Changed</h2>
              <div class="grid">

                <div>
                  <div class="small">Latency</div>
                  <div class="metric">${LATENCY} ms</div>
                  <div class="small">Δ ${LATENCY_DELTA}</div>
                </div>

                <div>
                  <div class="small">Reliability Δ</div>
                  <div class="metric">${REL_DELTA}</div>
                </div>

              </div>
            </div>

            EOF

            <!-- MULTILINGUAL -->
            <div class="card">
              <h2>🌍 Multilingual Retrieval</h2>
              <p>
            EOF

                echo "$LANGS" | sed \
                  -e 's/\ben\b/English/g' \
                  -e 's/\bes\b/Spanish/g' \
                  -e 's/\bfr\b/French/g' \
                  -e 's/\bde\b/German/g' \
                  -e 's/\bpt\b/Portuguese/g' \
                  -e 's/\bzh\b/Chinese/g' \
                  -e 's/\bja\b/Japanese/g' \
                >> $REPORT_FILE

                cat <<EOF >> $REPORT_FILE
              </p>
            </div>

            <!-- LANGUAGE DRIFT -->
            <div class="card">
              <h2>📈 Language Drift (Last 5 Runs)</h2>
              <div class="spark">
            EOF

                echo "$LANG_TREND" | sed \
                  -e 's/\ben\b/English/g' \
                  -e 's/\bes\b/Spanish/g' \
                  -e 's/\bfr\b/French/g' \
                  -e 's/\bde\b/German/g' \
                  -e 's/\bpt\b/Portuguese/g' \
                  -e 's/\bzh\b/Chinese/g' \
                  -e 's/\bja\b/Japanese/g' \
                >> $REPORT_FILE

                cat <<EOF >> $REPORT_FILE
              </div>
            </div>

            <!-- FLAKY TESTS -->
            <div class="card">
              <h2>🧪 Test Stability</h2>
            EOF

                REAL=$(echo "${{ steps.dbcompare.outputs.flaky_tests }}" | tr '|' '\n' | grep -E '\([1-9][0-9]*%')

                if [ -z "$REAL" ]; then
                  echo "<p class='ok'>🎉 No flaky tests detected</p>" >> $REPORT_FILE
                else
                  echo "<ul>" >> $REPORT_FILE
                  echo "$REAL" | while read -r line; do
                    echo "<li>$line</li>" >> $REPORT_FILE
                  done
                  echo "</ul>" >> $REPORT_FILE
                fi

                cat <<EOF >> $REPORT_FILE
            </div>

            cat <<EOF >> $REPORT_FILE

            <div class="card">
              <h2>📉 Last 5 Runs Trend</h2>

              <canvas id="trendChart" height="80"></canvas>

              <div class="small">
                ${TREND_SNAPSHOT}
              </div>
            </div>

            EOF

            cat <<EOF >> $REPORT_FILE

            <div class="card">
              <h2>📈 Trend Insight</h2>
            EOF

            if [ "$TREND" = "improving" ]; then
              echo "<p class='ok'>📈 System improving across recent runs</p>" >> $REPORT_FILE
            elif [ "$TREND" = "degrading" ]; then
              echo "<p class='warn'>📉 System degradation trend detected</p>" >> $REPORT_FILE
            else
              echo "<p>➖ System stable</p>" >> $REPORT_FILE
            fi

            cat <<EOF >> $REPORT_FILE
            </div>
            EOF

            <!-- FOOTER -->
            <div class="card small">
              <p>Last updated: $(date -u) UTC</p>
              <p>🧠 AI system evaluated across non-deterministic multilingual retrieval signals</p>
              <p class="small">Run ID: ${{ env.DB_RUN_ID }}</p>
            </div>

            </div>
            cat <<EOF >> $REPORT_FILE

            <script>
            (function () {
              const data = [${TREND_DATA}];
              const canvas = document.getElementById("trendChart");
              if (!canvas || data.length < 2) return;

              const ctx = canvas.getContext("2d");
              const w = canvas.width = canvas.offsetWidth;
              const h = canvas.height;

              const max = Math.max(...data);
              const min = Math.min(...data);

              const stepX = w / (data.length - 1);

              ctx.strokeStyle = "#06b6d4";
              ctx.lineWidth = 2;
              ctx.beginPath();

              data.forEach((val, i) => {
                const x = i * stepX;
                const y = h - ((val - min) / (max - min || 1)) * h;

                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
              });

              ctx.stroke();
            })();
            </script>

            EOF
            </body>
            </html>
            EOF
      
      - name: Upload dashboard report
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: summary.md
        
      - name: Convert to HTML
        run: |
          mkdir site
          cp summary.md site/index.md
      
  deploy-dashboard:
    needs: backend-weekly-regression
    runs-on: ubuntu-latest

    steps:
      - name: Download report artifact
        uses: actions/download-artifact@v4
        with:
          name: regression-report
          path: site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

