name: Weekly Regression Suite - Production Endpoint

on:
  schedule:
    - cron: "0 1 * * 3"   # Wednesday 1AM UTC
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  issues: write

jobs:
  backend-weekly-regression:
    environment: github-pages
    name: Production Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NIGHTLY: "true"
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      WORKFLOW_TYPE: weekly_regression_suite

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            portfolio-chatbot/package-lock.json

      - name: Install dependencies
        run: |
          cd portfolio-chatbot
          npm ci --prefer-offline

      - name: Validate API_BASE_URL
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "API_BASE_URL is empty"
            exit 1
          fi
      - name: Generate RUN_ID
        id: run_id
        run: echo "RUN_ID=$(uuidgen)" >> $GITHUB_ENV

      - name: Run regression suite (production endpoint)
        run: |
          cd portfolio-chatbot
          API_BASE_URL=$API_BASE_URL npm run test:ci

      # Publish JUnit results
      - name: Publish backend test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Regression Suite Results
          path: portfolio-chatbot/junit.xml
          reporter: java-junit

      # Upload artifacts
      - name: Upload regression artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Backend Regression Suite Results
          path: |
            portfolio-chatbot/junit.xml
            portfolio-chatbot/playwright-report/
            portfolio-chatbot/test-results/

      - name: Upload regression artifacts (structured)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-artifacts
          path: portfolio-chatbot/artifacts/

      - name: Upload metrics to database
        if: always()
        run: |
          cd portfolio-chatbot
          node scripts/upload-metrics.js

      - name: Evaluate regression gate
        id: regression_gate
        continue-on-error: true
        run: |
          node << 'EOF'
          const fs = require("fs");
          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_KEY = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const RUN_ID = process.env.RUN_ID;

          async function fetchJSON(url, options = {}) {
            const res = await fetch(url, options);
            if (!res.ok) {
              const text = await res.text();
              throw new Error(text);
            }
            return res.json();
          }

          async function main() {

            // Analysis computed in DB through a function
            const [analysis] = await fetchJSON(
              `${SUPABASE_URL}/rest/v1/regression_story?run_id=eq.${RUN_ID}`
            );

            if (!analysis || analysis.latency_delta === null) {
              console.log("Not enough historical data → skipping regression evaluation");
              return;
            }

            if (analysis.regression_severity === "critical" || analysis.regression_severity === "moderate") {
              console.log("🚨 Regression detected via DB intelligence layer");
              process.exit(1);
            }
          }

          main().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF

      - name: Capture regression status
        if: always()
        run: |
          if [ "${{ steps.regression_gate.outcome }}" = "failure" ]; then
            echo "REGRESSION_STATUS=FAIL" >> $GITHUB_ENV
          else
            echo "REGRESSION_STATUS=PASS" >> $GITHUB_ENV
          fi
      
      - name: Record failure events
        if: failure()
        run: |
          node << 'EOF'
          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_KEY = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const RUN_ID = process.env.RUN_ID;

          async function insertFailure(event) {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/failure_events`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                apikey: SUPABASE_KEY,
                Authorization: `Bearer ${SUPABASE_KEY}`
              },
              body: JSON.stringify(event)
            });

            if (!res.ok) {
              const text = await res.text();
              throw new Error(text);
            }
          }

          async function main() {
            // simple classification for now
            const events = [
              {
                run_id: RUN_ID,
                test_id: "regression_gate",
                classification: "system_regression",
                root_signal: "latency|retrieval|rate_limit"
              }
            ];

            for (const e of events) {
              await insertFailure(e);
            }

            console.log("Failure events recorded");
          }

          main().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF

      # Dashboard
      - name: Compare with previous runs from DB
        continue-on-error: true
        id: dbcompare
        run: |
          node << 'EOF'
          const fs = require("fs");
          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_KEY = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const RUN_ID = process.env.RUN_ID;

          async function fetchJSON(url) {
            const res = await fetch(url, {
              headers: {
                apikey: SUPABASE_KEY,
                Authorization: `Bearer ${SUPABASE_KEY}`
              }
            });

            if (!res.ok) {
              const text = await res.text();
              throw new Error(text);
            }

            return res.json();
          }

          async function main() {
            // 🔥 Query the interpretation layer (NOT raw tables)
            const data = await fetchJSON(
              `${SUPABASE_URL}/rest/v1/regression_story?run_id=eq.${RUN_ID}`
            );

            if (!data.length) {
              console.log("No comparison data available");

              fs.appendFileSync(process.env.GITHUB_OUTPUT, "trend=N/A\n");
              fs.appendFileSync(process.env.GITHUB_OUTPUT, "severity=N/A\n");
                const defaults = {
                  latency_delta: "N/A",
                  latency_pct: "N/A",
                  confidence_delta: "N/A",
                  confidence_pct: "N/A",
                  reliability_delta: "N/A",
                  trend: "N/A",
                  severity: "N/A",
                  signal: "N/A"
                };

                for (const [k, v] of Object.entries(defaults)) {
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, `${k}=${v}\n`);
                }
              return;
            }

            const r = data[0];

            // ✅ Export structured outputs for downstream steps
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `latency_delta=${r.latency_delta}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `latency_pct=${r.latency_pct}\n`);

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `confidence_delta=${r.confidence_delta}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `confidence_pct=${r.confidence_pct}\n`);

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `reliability_delta=${r.reliability_delta}\n`);

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `trend=${r.trend_direction}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `severity=${r.regression_severity}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `signal=${r.primary_signal}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `analysis_confidence=${r.analysis_confidence}\n`);

            // classification shortcut
            const classification =
              r.primary_signal === "system_degradation"
                ? "system_degradation"
                : "no_major_issue";

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `classification=${classification}\n`);

            // 🧠 Human-readable log (helps debugging CI)
            console.log("---- Regression Story ----");
            console.log(`Latency Δ: ${r.latency_delta} (${(r.latency_pct * 100).toFixed(2)}%)`);
            console.log(`Confidence Δ: ${r.confidence_delta} (${(r.confidence_pct * 100).toFixed(2)}%)`);
            console.log(`Reliability Δ: ${r.reliability_delta}`);
            console.log(`Trend: ${r.trend_direction}`);
            console.log(`Severity: ${r.regression_severity}`);
            console.log(`Signal: ${r.primary_signal}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `baseline_deviation=N/A\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `deviation_severity=N/A\n`);

            const anomaly = await fetchJSON(
              `${SUPABASE_URL}/rest/v1/regression_anomalies?run_id=eq.${RUN_ID}`
            );

            if (anomaly.length) {
              const a = anomaly[0];
              const z = a.latency_zscore;

              const severity =
                Math.abs(z) > 3 ? "critical" :
                Math.abs(z) > 2 ? "high" :
                Math.abs(z) > 1 ? "moderate" : "normal";
              
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `baseline_deviation=${z}\n`);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `deviation_severity=${severity}\n`);

              if (Math.abs(z) > 1) {
                const direction = z > 0 ? "higher" : "lower";
                console.log("---- Anomaly Detection ----");

                console.log(`📊 Metric: Latency (P95)`);
                console.log(`- Current: ${a.p95_latency} ms`);
                console.log(`- Mean: ${a.mean_latency?.toFixed(2)} ms`);
                console.log(`- Baseline Deviation: ${z.toFixed(2)} (${severity})`);

                // Directional insight
                console.log(`Latency is ${Math.abs(z).toFixed(1)}x deviation from normal (${direction} than expected)`);
                
                if (r.primary_signal === "system_degradation" && Math.abs(z) > 2) {
                  console.log("🔥 Confirmed: anomaly aligns with system degradation signal");
                }

                // Correlation with regression signals
                if (z > 2 && a.p95_latency > 0) {
                  console.log(`🧩 Likely Impact:`);

                  if (a.p95_latency > 0) {
                    console.log(`- Increased response time may degrade retrieval ranking quality`);
                  }

                  console.log(`- Potential infrastructure or backend slowdown`);
                }

                console.log(`🧠 Interpretation:`);
                console.log(`Latency deviates ${Math.abs(z).toFixed(2)} standard deviations from normal behavior`);
              }
            }
          }

          main().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF

      - name: Enforce regression gate
        if: steps.regression_gate.outcome == 'failure'
        run: |
          echo "🚨 Regression detected → blocking CI"
          exit 1

      - name: Generate AI Regression Dashboard
        if: always()
        run: |
          echo "## 🧠 This Report combines regression analysis, trend detection, and anomaly detection across historical runs." >> $GITHUB_STEP_SUMMARY

          echo "### 🧪 Test Status" >> $GITHUB_STEP_SUMMARY
          echo "- Status: $REGRESSION_STATUS" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 System Health Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Overall Status: $REGRESSION_STATUS" >> $GITHUB_STEP_SUMMARY
          echo "- Analysis Confidence: ${{ steps.dbcompare.outputs.analysis_confidence }}" >> $GITHUB_STEP_SUMMARY
          echo "- Trend: ${{ steps.dbcompare.outputs.trend }}" >> $GITHUB_STEP_SUMMARY
          echo "- Severity: ${{ steps.dbcompare.outputs.severity }}" >> $GITHUB_STEP_SUMMARY
          echo "- Primary Signal: ${{ steps.dbcompare.outputs.signal }}" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🧠 What Changed" >> $GITHUB_STEP_SUMMARY
          echo "- Latency: ${{ steps.dbcompare.outputs.latency_delta }} ms ($(echo "${{ steps.dbcompare.outputs.latency_pct }} * 100" | bc)%)" >> $GITHUB_STEP_SUMMARY
          echo "- Confidence: ${{ steps.dbcompare.outputs.confidence_delta }} ($(echo "${{ steps.dbcompare.outputs.confidence_pct }} * 100" | bc)%)" >> $GITHUB_STEP_SUMMARY
          echo "- Reliability: ${{ steps.dbcompare.outputs.reliability_delta }}" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚠️ Anomaly Detection" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.dbcompare.outputs.baseline_deviation }}" != "N/A" ]; then
            echo "- Baseline Deviation: ${{ steps.dbcompare.outputs.baseline_deviation }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- Severity: ${{ steps.dbcompare.outputs.deviation_severity }}" >> $GITHUB_STEP_SUMMARY
          echo "- Analysis Confidence: ${{ steps.dbcompare.outputs.analysis_confidence }}" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🧩 Diagnosis" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.dbcompare.outputs.signal }}" = "system_degradation" ]; then
            echo "- System degradation detected: latency increase correlates with retrieval confidence drop" >> $GITHUB_STEP_SUMMARY
            echo "- Likely root cause: backend latency impacting ranking quality" >> $GITHUB_STEP_SUMMARY

          elif [ "${{ steps.dbcompare.outputs.signal }}" = "latency_regression" ]; then
            echo "- Backend performance regression detected" >> $GITHUB_STEP_SUMMARY
            echo "- Monitor API response time and infrastructure load" >> $GITHUB_STEP_SUMMARY

          elif [ "${{ steps.dbcompare.outputs.signal }}" = "retrieval_regression" ]; then
            echo "- Retrieval relevance degradation detected" >> $GITHUB_STEP_SUMMARY
            echo "- Possible embedding drift or ranking instability" >> $GITHUB_STEP_SUMMARY

          else
            echo "- System stable across performance, retrieval, and rate limiting signals" >> $GITHUB_STEP_SUMMARY
          fi

