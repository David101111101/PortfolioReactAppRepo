name: Weekly Regression Suite - Production Endpoint

on:
  schedule:
    - cron: "0 1 * * 3"   # Wednesday 1AM UTC
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  issues: write

jobs:
  backend-weekly-regression:
    environment: github-pages
    name: Production Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NIGHTLY: "true"
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            portfolio-chatbot/package-lock.json

      - name: Install dependencies
        run: |
          cd portfolio-chatbot
          npm ci --prefer-offline

      - name: Validate API_BASE_URL
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "API_BASE_URL is empty"
            exit 1
          fi

      #verify deployed API is alive
      - name: Health check deployed API
        id: health
        run: |
          START=$(date +%s%3N)
          curl --silent --show-error --fail "${API_BASE_URL}/health"
          END=$(date +%s%3N)
          LAT=$((END-START))
          echo "lat=$LAT" >> $GITHUB_OUTPUT


      - name: Run regression suite (production endpoint)
        run: |
          cd portfolio-chatbot
          API_BASE_URL=$API_BASE_URL npm run test:ci

      # Publish JUnit results
      - name: Publish backend test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Regression Suite Results
          path: portfolio-chatbot/junit.xml
          reporter: java-junit

      # Upload artifacts
      - name: Upload regression artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Backend Regression Suite Results
          path: |
            portfolio-chatbot/junit.xml
            portfolio-chatbot/playwright-report/
            portfolio-chatbot/test-results/

      - name: Capture regression status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "REGRESSION_STATUS=PASS" >> $GITHUB_ENV
          else
            echo "REGRESSION_STATUS=FAIL" >> $GITHUB_ENV
          fi

      - name: Upload latency metric
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latency-metric
          path: portfolio-chatbot/latency-metric.json
      
      - name: Download previous latency metric
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: weekly-regression-gates.yml
          branch: main
          name: latency-metric
          path: prev-metrics

      # Dashboard
      - name: Compute latency trend
        id: latencytrend
        run: |
          CUR=$(jq .avgLatencyMs portfolio-chatbot/latency-metric.json)

          if [ -f prev-metrics/latency-metric.json ]; then
            PREV=$(jq .avgLatencyMs prev-metrics/latency-metric.json)
            DELTA=$((CUR-PREV))
          else
            PREV="N/A"
            DELTA="N/A"
          fi

          echo "cur=$CUR" >> $GITHUB_OUTPUT
          echo "prev=$PREV" >> $GITHUB_OUTPUT
          echo "delta=$DELTA" >> $GITHUB_OUTPUT

      - name: Generate Regression Dashboard
        if: always()
        run: |
          echo "## 🧪 Regression Result" >> $GITHUB_STEP_SUMMARY
          echo "- Status: $REGRESSION_STATUS" >> $GITHUB_STEP_SUMMARY

          echo "## Environment" >> $GITHUB_STEP_SUMMARY
          echo "- Endpoint: $API_BASE_URL" >> $GITHUB_STEP_SUMMARY
          echo "- Runner: ubuntu-latest" >> $GITHUB_STEP_SUMMARY
          echo "- Node: $(node -v)" >> $GITHUB_STEP_SUMMARY
          echo "- Date: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "- Rate limiting enforcement" >> $GITHUB_STEP_SUMMARY
          echo "- RAG retrieval regression" >> $GITHUB_STEP_SUMMARY
          echo "- Backend contract validation" >> $GITHUB_STEP_SUMMARY
          echo "- LLM latency benchmarking" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🤖 LLM Latency Trend" >> $GITHUB_STEP_SUMMARY
          echo "- Current avg latency: ${{ steps.latencytrend.outputs.cur }} ms" >> $GITHUB_STEP_SUMMARY
          echo "- Previous week: ${{ steps.latencytrend.outputs.prev }} ms" >> $GITHUB_STEP_SUMMARY
          echo "- Delta: ${{ steps.latencytrend.outputs.delta }} ms" >> $GITHUB_STEP_SUMMARY

          echo "## 🌐 API Availability" >> $GITHUB_STEP_SUMMARY
          echo "- Health endpoint latency: ${{ steps.health.outputs.lat }} ms" >> $GITHUB_STEP_SUMMARY

          echo "## 📈 Production Confidence Signal" >> $GITHUB_STEP_SUMMARY

          if [ "$REGRESSION_STATUS" = "PASS" ]; then
            echo "✅ No regressions detected in AI retrieval or backend contracts" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ LLM latency within expected range" >> $GITHUB_STEP_SUMMARY
          fi
