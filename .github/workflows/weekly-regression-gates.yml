name: Weekly Regression Suite - Production Endpoint

on:
  schedule:
    - cron: "0 1 * * 3"   # Wednesday 1AM UTC
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  backend-weekly-regression:
    name: Production Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NIGHTLY: "true"
      API_BASE_URL: ${{ secrets.API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            portfolio-chatbot/package-lock.json

      - name: Install dependencies
        run: |
          cd portfolio-chatbot
          npm ci --prefer-offline

      # Optional: verify deployed API is alive
      - name: Health check deployed API
        run: |
          curl --retry 3 --retry-delay 5 --fail -X POST $API_BASE_URL \
            -H "Content-Type: application/json" \
            -d '{"question":"health check api deployed endpoint"}'

      - name: Run regression suite (production endpoint)
        run: |
          cd portfolio-chatbot
          API_BASE_URL=$API_BASE_URL npm run test:ci

      # Publish JUnit results
      - name: Publish backend test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Regression Suite Results
          path: portfolio-chatbot/junit.xml
          reporter: java-junit

      # Upload artifacts
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backend Regression Suite Results
          path: portfolio-chatbot/junit.xml

      # Dashboard
      - name: Generate Regression Dashboard
        if: always()
        run: |
          echo "# 🧪 Weekly AI Production Regression Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Environment" >> $GITHUB_STEP_SUMMARY
          echo "- Endpoint: $API_BASE_URL" >> $GITHUB_STEP_SUMMARY
          echo "- Runner: ubuntu-latest" >> $GITHUB_STEP_SUMMARY
          echo "- Node: $(node -v)" >> $GITHUB_STEP_SUMMARY
          echo "- Date: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "- Rate limiting enforcement" >> $GITHUB_STEP_SUMMARY
          echo "- RAG retrieval regression" >> $GITHUB_STEP_SUMMARY
          echo "- Backend contract validation" >> $GITHUB_STEP_SUMMARY
          echo "- LLM latency benchmarking" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🤖 LLM Latency Monitoring" >> $GITHUB_STEP_SUMMARY

          if grep -r "llm_latency_warning" . ; then
            echo "⚠️ LLM latency regression detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ LLM latency within expected range" >> $GITHUB_STEP_SUMMARY
          fi