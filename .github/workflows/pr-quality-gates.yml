name: PR Quality Gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: pr-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==============================
  # 1️⃣ Backend Tests (Fast Tier)
  # ==============================
  backend:
    name: Backend Tests (unit + contract)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            portfolio-chatbot/package-lock.json

      # Install root deps (if needed)
      - name: Install root deps
        run: npm ci

      # Install backend deps
      - name: Install backend deps
        run: |
          cd portfolio-chatbot
          npm ci

      # Start Worker in background for contract test
      - name: Start Worker
        run: |
          cd portfolio-chatbot
          npm run dev &
          npx wait-on http://127.0.0.1:8787

      # Run backend tests
      - name: Run backend tests
        run: |
          cd portfolio-chatbot
          npm test
  # ==============================
  # 2️⃣ Frontend E2E (Chromium Only)
  # ==============================
  e2e:
    name: E2E (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend # Ensure backend tests pass before running E2E
    env:
      VITE_BASE: /

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            portfolio-chatbot/package-lock.json

      - name: Install deps
        run: npm ci
        
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install Chromium browser
        run: npx playwright install chromium --with-deps

      - name: Build (for preview server)
        run: npm run build
        env:
          VITE_BASE: /

      - name: Run Playwright tests
        run: npx playwright test --project=chromium

      - name: Publish test results (JUnit → GitHub UI)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Junit Report
          path: playwright-report/junit.xml
          reporter: java-junit

      - name: Write summary snippet
        if: always()
        run: node scripts/playwright-summary.mjs chromium summaries/chromium.md

      - name: Upload summary snippet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pw-summary-chromium
          path: summaries/chromium.md


      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-chromium
          path: |
            playwright-report/
            test-results/
  # ==============================
  # 3️⃣ Lighthouse Budget Gate
  # ==============================
  lighthouse:
    name: Lighthouse (budgets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_BASE: /
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            portfolio-chatbot/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Audit with Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true

  pr-comment:
    if: ${{ always() && github.event_name == 'pull_request' }} #Only run for PRs
    needs: [e2e, lighthouse]
    runs-on: ubuntu-latest
    steps:
      - name: Download summaries
        uses: actions/download-artifact@v4
        with:
          pattern: pw-summary-*
          merge-multiple: true
          path: summaries

      - name: Build PR comment body
        run: |
          echo "## ✅ PR Quality Gate Results" > comment.md
          echo "" >> comment.md
          cat summaries/*.md >> comment.md
          echo "" >> comment.md
          echo "### 🔎 Lighthouse" >> comment.md
          echo "- See Lighthouse artifact in this workflow run (Scores + failing assertions are visible in the action UI)." >> comment.md
          echo "" >> comment.md
          echo "_Debug: PR → Checks → failing job → Artifacts → open playwright-report/index.html; traces via npx playwright show-trace trace.zip_" >> comment.md

      - name: Find existing comment
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "PR Quality Gate Results"

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          body-path: comment.md
          edit-mode: replace
