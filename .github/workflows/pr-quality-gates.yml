name: PR Quality Gates

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: pr-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==============================
  # 1️⃣ Backend Tests (Fast Tier)
  # ==============================
  backend:
    name: Backend Tests (unit + contract)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            portfolio-chatbot/package-lock.json

      # Install root deps (if needed)
      - name: Install root deps
        run: npm ci

      # Install backend deps
      - name: Install backend deps
        run: |
          cd portfolio-chatbot
          npm ci

      # Start Worker in background for contract test
      - name: Start Worker
        run: |
          cd portfolio-chatbot
          npm run dev &
          npx wait-on tcp:127.0.0.1:8787 --timeout 40000

      # Run backend tests
      - name: Run backend tests
        run: |
          cd portfolio-chatbot
          npm test
  # ==============================
  # 2️⃣ Frontend E2E (Chromium Only)
  # ==============================
  e2e:
    name: E2E (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend # Ensure backend tests pass before running E2E
    env:
      VITE_BASE: /
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WORKFLOW_TYPE: pr_e2e
      PLAYWRIGHT_BROWSER: chromium

    steps:
      - name: Capture start
        run: echo "START=$(date +%s)" >> $GITHUB_ENV

      - uses: actions/checkout@v5

      - name: Set RUN_ID
        run: echo "RUN_ID=${{ github.run_id }}-${{ github.run_attempt }}" >> $GITHUB_ENV

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            portfolio-chatbot/package-lock.json

      - name: Install deps
        run: npm ci
        
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install Playwright OS deps
        run: npx playwright install-deps chromium

      - name: Install Chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3; do
            npx playwright install chromium && break
            echo "Retrying browser install..."
            sleep 10
          done

      - name: Build (for preview server)
        run: npm run build
        env:
          VITE_BASE: /
      
      - name: Measure bundle size
        run: |
          SIZE=$(find dist/assets -name "*.js" -exec du -k {} + | awk '{sum+=$1} END {print sum}')  
          mkdir -p metrics
          echo "{ \"bundleKB\": $SIZE }" > metrics/bundle.json

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: metrics-bundle
          path: metrics/bundle.json    

      - name: Run Playwright tests
        id: playwright
        run: npx playwright test --project=chromium

      - name: Write accessibility metrics
        if: always()
        run: |
          mkdir -p metrics
          echo "{ \"axeCritical\": ${AXE_CRITICAL_COUNT:-0} }" > metrics/a11y.json

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: metrics-a11y
          path: metrics/a11y.json

      - name: Publish test results (JUnit → GitHub UI)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Junit Report
          path: playwright-report/junit.xml
          reporter: java-junit

      - name: Write summary snippet
        if: always()
        run: |
          node scripts/playwright-summary.mjs chromium summaries/chromium.md

      - name: Upload summary snippet (always for PR comment)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pw-summary-chromium
          path: summaries/chromium.md

      - name: Capture duration
        if: always()
        run: |
          END=$(date +%s)
          DURATION=$((END-START))
          mkdir -p metrics
          echo "{ \"durationSec\": $DURATION }" > metrics/duration.json

      - name: Upload Playwright artifacts
        if: ${{ always() && steps.playwright.outcome != 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-chromium
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/

      - name: Write E2E metrics
        if: always()
        run: |
          mkdir -p metrics
          if [ "${{ steps.playwright.outcome }}" = "success" ]; then
            echo '{ "e2e":"pass" }' > metrics/e2e.json
          else
            echo '{ "e2e":"fail" }' > metrics/e2e.json
          fi

      - name: Ingest E2E metrics to Supabase
        if: always()
        run: node scripts/ingest-e2e-metrics.mjs

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: metrics-e2e
          path: metrics/e2e.json
      
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: metrics-duration
          path: metrics/duration.json
      
  # ==============================
  # 3️⃣ Lighthouse - Performance & Accessibility Gate
  # ==============================
  lighthouse:
    name: Lighthouse - Performance, SEO & Accessibility Gate
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_BASE: /
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            portfolio-chatbot/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Audit with Lighthouse CI
        id: lhci
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.github/lighthouse/lighthouserc-ci.json
          uploadArtifacts: false

      - name: Generate Lighthouse summary
        if: always()
        run: |
          mkdir -p summaries metrics
          node scripts/lighthouse-summary.mjs > summaries/lighthouse.md
          echo "Lighthouse summary generated"
      
      - name: Upload Lighthouse summary
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lighthouse-summary
          path: summaries/lighthouse.md

      - name: Upload Lighthouse artifacts (only on failure)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: lighthouse-report
          path: .lighthouseci
        
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: metrics-lighthouse
          path: metrics/lighthouse.json
  
  quality-score:
    name: Compute PR Quality Score
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [e2e, lighthouse]

    steps:
      - uses: actions/checkout@v5 
      - name: Download metrics
        uses: actions/download-artifact@v5
        with:
          pattern: "*"
          merge-multiple: true
          path: metrics
      
      - name: Flatten metrics
        run: |
          find metrics -type f -name "*.json" -exec cp {} metrics/ \;

      - name: Compute score
        run: |
          mkdir -p summaries
          node scripts/pr-quality-score.mjs

      - name: Upload quality score
        uses: actions/upload-artifact@v5
        with:
          name: summary-quality-score
          path: summaries/quality-score.md
    

  pr-comment:
    if: ${{ always() && github.event_name == 'pull_request' }} #Only run for PRs
    needs: [quality-score]
    runs-on: ubuntu-latest
    steps:
      - name: Download summaries
        uses: actions/download-artifact@v5
        with:
          pattern: "*summary*"
          merge-multiple: true
          path: summaries

      - name: Download metrics
        uses: actions/download-artifact@v5
        with:
          pattern: "*"
          merge-multiple: true
          path: metrics

      - name: Build PR comment body
        run: |
          echo "## ✅ PR Quality Gate Results" > comment.md
          echo "" >> comment.md
          if [ -f summaries/quality-score.md ]; then
            cat summaries/quality-score.md >> comment.md
          else
            echo "### 🎯 PR Quality Score" >> comment.md
            echo "Quality score summary unavailable." >> comment.md
            echo "" >> comment.md
          fi
          if [ -f summaries/chromium.md ]; then
            cat summaries/chromium.md >> comment.md
          else
            echo "### 🌍 E2E (chromium)" >> comment.md
            echo "Summary unavailable." >> comment.md
            echo "" >> comment.md
          fi
          if [ -f summaries/lighthouse.md ]; then
            sed -E 's/Home \(`?\/?`?\)/Home/g; s/Dashboard \(`?#\/dashboard`?\)/Dashboard/g' summaries/lighthouse.md >> comment.md
          else
            echo "### 🔎 Lighthouse" >> comment.md
            echo "Summary unavailable." >> comment.md
            echo "" >> comment.md
          fi
          echo "" >> comment.md
          echo "### 🔎 Lighthouse" >> comment.md
          echo "- See Lighthouse artifact in this workflow run (Scores + failing assertions are visible in the action UI)." >> comment.md
          echo "" >> comment.md
          echo "_Debug: For Debugging PR → Checks → failing job → Artifacts → open playwright-report/index.html; traces via npx playwright show-trace trace.zip_" >> comment.md

      - name: Create or update comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            const issue_number = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((c) =>
              c.user?.login === 'github-actions[bot]' &&
              typeof c.body === 'string' &&
              c.body.includes('PR Quality Gate Results')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
