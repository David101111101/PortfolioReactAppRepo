name: PR Quality Gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: pr-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==============================
  # 1️⃣ Backend Tests (Fast Tier)
  # ==============================
  backend:
    name: Backend Tests (unit + contract)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            portfolio-chatbot/package-lock.json

      # Install root deps (if needed)
      - name: Install root deps
        run: npm ci

      # Install backend deps
      - name: Install backend deps
        run: |
          cd portfolio-chatbot
          npm ci

      # Start Worker in background for contract test
      - name: Start Worker
        run: |
          cd portfolio-chatbot
          npm run dev &
          npx wait-on tcp:127.0.0.1:8787 --timeout 40000

      # Run backend tests
      - name: Run backend tests
        run: |
          cd portfolio-chatbot
          npm test
  # ==============================
  # 2️⃣ Frontend E2E (Chromium Only)
  # ==============================
  e2e:
    name: E2E (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend # Ensure backend tests pass before running E2E
    env:
      VITE_BASE: /

    steps:
      - name: Capture start
        run: echo "START=$(date +%s)" >> $GITHUB_ENV

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            portfolio-chatbot/package-lock.json

      - name: Install deps
        run: npm ci
        
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install Chromium browser
        run: npx playwright install chromium --with-deps

      - name: Build (for preview server)
        run: npm run build
        env:
          VITE_BASE: /
      
      - name: Measure bundle size
        run: |
          SIZE=$(du -sk dist | cut -f1)
          mkdir -p metrics
          echo "{ \"bundleKB\": $SIZE }" > metrics/bundle.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metrics-bundle
          path: metrics/bundle.json    

      - name: Run Playwright tests
        run: npx playwright test --project=chromium

      - name: Write accessibility metrics
        if: always()
        run: |
          mkdir -p metrics
          echo "{ \"axeCritical\": ${AXE_CRITICAL_COUNT:-0} }" > metrics/a11y.json

      - name: Publish test results (JUnit → GitHub UI)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Junit Report
          path: playwright-report/junit.xml
          reporter: java-junit
      
      - name: Compute PR Quality Score
        run: node scripts/pr-quality-score.mjs >> comment.md

      - name: Write summary snippet
        if: always()
        run: |
          node scripts/playwright-summary.mjs chromium summaries/chromium.md

      - name: Upload summary snippet (always for PR comment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pw-summary-chromium
          path: summaries/chromium.md


      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-chromium
          path: |
            playwright-report/
            test-results/

      - name: Write E2E metrics
        if: always()
        run: |
          mkdir -p metrics
          if [ "${{ job.status }}" = "success" ]; then
            echo '{ "e2e":"pass" }' > metrics/e2e.json
          else
            echo '{ "e2e":"fail" }' > metrics/e2e.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metrics-e2e
          path: metrics/e2e.json
      
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metrics-duration
          path: metrics/duration.json
      
      - name: Capture duration
        if: always()
        run: |
          END=$(date +%s)
          DURATION=$((END-START))
          mkdir -p metrics
          echo "{ \"durationSec\": $DURATION }" > metrics/duration.json
  # ==============================
  # 3️⃣ Lighthouse - Performance & Accessibility Gate
  # ==============================
  lighthouse:
    name: Lighthouse - Performance, SEO & Accessibility Gate
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_BASE: /
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            portfolio-chatbot/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Audit with Lighthouse CI
        id: lhci
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json #contains thresholds for performance, accessibility, best practices & SEO
          uploadArtifacts: false

      - name: Generate Lighthouse summary
        if: always()
        run: |
          mkdir -p summaries metrics
          node scripts/lighthouse-summary.mjs > summaries/lighthouse.md
          echo "Lighthouse summary generated"
      
      - name: Upload Lighthouse summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-summary
          path: summaries/lighthouse.md

      - name: Upload Lighthouse artifacts (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci
    

  pr-comment:
    if: ${{ always() && github.event_name == 'pull_request' }} #Only run for PRs
    needs: [e2e, lighthouse]
    runs-on: ubuntu-latest
    steps:
      - name: Download summaries
        uses: actions/download-artifact@v4
        with:
          pattern: "*summary*"
          merge-multiple: true
          path: summaries

      - name: Download metrics
        uses: actions/download-artifact@v4
        with:
          pattern: metrics-*
          merge-multiple: true
          path: metrics

      - name: Build PR comment body
        run: |
          echo "## ✅ PR Quality Gate Results" > comment.md
          echo "" >> comment.md
          cat summaries/*.md >> comment.md
          echo "" >> comment.md
          echo "### 🔎 Lighthouse" >> comment.md
          echo "- See Lighthouse artifact in this workflow run (Scores + failing assertions are visible in the action UI)." >> comment.md
          echo "" >> comment.md
          echo "_Debug: For Debugging PR → Checks → failing job → Artifacts → open playwright-report/index.html; traces via npx playwright show-trace trace.zip_" >> comment.md

      - name: Find existing comment
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "PR Quality Gate Results"

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          body-path: comment.md
          edit-mode: replace
